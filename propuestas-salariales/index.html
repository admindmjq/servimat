<script>
/* ===== Motor de cálculo: remuneraciones Chile (oct-2026) ===== */
const SIM = (() => {
  const norm = (s) => String(s ?? '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/\s+/g, ' ').trim();
  const r0 = (x) => Math.round(x || 0);
  const num = (v) => { if (v == null || v === '') return 0; if (typeof v === 'number') return v; const s = String(v).replace(/\$/g, '').replace(/\s/g, ''); const n = s.includes(',') && !/\.\d{3}(\D|$)/.test(s) ? Number(s.replace(',', '.')) : Number(s.replace(/\.(?=\d{3}(\D|$))/g, '').replace(',', '.')); return isFinite(n) ? n : 0; };

  /* ---------- Parámetros por defecto (octubre 2026) ---------- */
  const DEFAULT_PARAMS = {
    imm: 553553,              // Ley 21.8xx, vigente desde 01-05-2026
    uf: 41057.20,             // UF al 30-09-2026 (topes del mes)
    utm: 72151,               // UTM octubre 2026
    topeAfpUF: 90,            // tope imponible AFP/salud 2026
    topeCesUF: 135.2,         // tope seguro de cesantía 2026
    gratMode: 'tope',         // 'tope' = tope mensual garantizado | 'art50' = 25% con tope
    gratFactorIMM: 4.75,
    salud: 7,
    cesTrabIndef: 0.6, cesEmplIndef: 2.4, cesEmplPlazo: 3.0,

/* ---------- Impacto en la empresa (todas las personas activas) ---------- */
const vz = () => ({ n: 0, base: 0, fij: 0, var: 0, hab: 0, ap: 0, fijY: 0, varY: 0, habY: 0, apY: 0 });
function vec(M) { const v = M.comision + (M.resalta || 0) + M.he; return { n: 1, base: M.base, fij: M.haberes - v, var: v, hab: M.haberes, ap: M.aportes, fijY: M.anual.haberes - 12 * v, varY: 12 * v, habY: M.anual.haberes, apY: M.anual.aportes }; }
function vadd(a, b, k = 1) { for (const f in a) a[f] += k * (b[f] || 0); return a; }
let baseCache = null; const OBJID = new WeakMap();
function baselineLive() {
  const key = [st.emps.length, st.P, st.C, st.T, st.K, st.H].map((x) => (x && typeof x === 'object' ? (OBJID.get(x) || (OBJID.set(x, Math.random()), OBJID.get(x))) : x)).join('|');
  if (baseCache?.key === key) return baseCache.data;
  const X = wX(), stores = {};
  for (const e of st.emps) { const A0 = E.compute(E.actualScenario(e, {}, X), st.P, st.C); const s = (stores[e.l] = stores[e.l] || { t: e.t, v: vz() }); vadd(s.v, vec(A0)); }
  const data = { stores, at: nowISO(), periodo: st.meta?.periodo || '' };
  baseCache = { key, data };
  return data;
}
function empresaImpacto(lines, P, C, X, base) {
  if (!base?.stores) return null;
  const S = {};
  for (const l in base.stores) S[l] = { l, t: base.stores[l].t, A: vadd(vz(), base.stores[l].v), B: vadd(vz(), base.stores[l].v) };
  const get = (l, t) => (S[l] = S[l] || { l, t, A: vz(), B: vz() });
  for (const { e, o } of lines) {
    const A0 = vec(E.compute(E.actualScenario(e, {}, X), P, C));
    const { A, B, s } = calcPair(e, o, P, C, X);
    const sa = get(e.l, e.t); vadd(sa.A, vec(A)); vadd(sa.A, A0, -1); vadd(sa.B, A0, -1);
    vadd(get(s.idLocal, s.tienda).B, vec(B));
  }
  const stores = Object.values(S).filter((x) => x.A.n || x.B.n).sort((a, b) => Number(a.l) - Number(b.l));
  const tA = stores.reduce((t, x) => vadd(t, x.A), vz()), tB = stores.reduce((t, x) => vadd(t, x.B), vz());
  return { stores, tA, tB, at: base.at, periodo: base.periodo };
}

  add('Variables (comisión, resalta, horas extra)', [a.var, b.var], 'sub', true);
  add('Costos del empleador (leyes sociales)', [a.aportes, b.aportes], '', true);
  add('Costo total mensual', [a.costo, b.costo], 'tot', true);

async function handleFiles(files) {
  try { await lib('xlsx'); } catch (e) { toast('No se pudo cargar el lector de Excel. Revisa tu conexión.'); return; }
  for (const f of files) {
    try {
      const buf = await f.arrayBuffer();
      const wb = XLSX.read(buf, { type: 'array', cellDates: false });
      const ws = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(ws, { defval: null, raw: true });
      const headers = rows.length ? Object.keys(rows[0]) : [];
      const item = { name: f.name, kind: 'unknown' };
      if (E.isMatrix(headers)) { item.kind = 'matrix'; item.emps = E.parseMatrix(rows); }
      else if (E.isConvenio(headers)) { item.kind = 'conv'; item.rows = rows; item.conv = E.parseConvenio(rows); item.key = E.convKeyFromFile(f.name, item.conv.cotab); }
      else if (headers.some((h) => /rut|id.?persona/i.test(h))) { item.kind = 'comis'; item.comis = E.parseComisiones(rows); }
      st.pending.push(item);
    } catch (e) { st.pending.push({ name: f.name, kind: 'unknown' }); }
  }
  render();
}
async function publishPending() {
  const per = $('#pend-per')?.value || todayISO().slice(0, 7);
  const keep = $('#pend-keep')?.checked;
  const mx = st.pending.filter((p) => p.kind === 'matrix').pop();
  const cvs = st.pending.filter((p) => p.kind === 'conv' && p.key);
  const cms = st.pending.filter((p) => p.kind === 'comis');
  if (!mx && !cvs.length && !cms.length) return toast('No hay archivos reconocidos para publicar.');
  toast('Publicando bases…');
  try {
    // Convenios
    if (cvs.length || mx) {
      const C = { ...st.C };
      cvs.forEach((p) => { C[p.key] = keep && st.C[p.key] ? E.parseConvenio(p.rows, st.C[p.key]) : p.conv; });
      const emps = mx ? mx.emps : st.emps;
      const tiendas = [...new Map(emps.map((e) => [e.l, e.t])).entries()];
      const cargos = [...new Set(emps.map((e) => e.c))].filter(Boolean);
      await store.set('params/convenios', { conv: C, tiendas, cargos, at: nowISO(), by: st.me || null });
      st.C = C; st.tiendas = tiendas; st.cargos = cargos;
    }
    let meta = { ...(st.meta || {}) };
    if (mx) {
      const n = Math.ceil(mx.emps.length / EMP_CHUNK);
      for (let k = 0; k < n; k++) await store.set(`bases/emp-${k}`, { emps: mx.emps.slice(k * EMP_CHUNK, (k + 1) * EMP_CHUNK).map(({ cm, ...x }) => x) });
      for (let k = n; k < (meta.chunks || 0); k++) await store.del(`bases/emp-${k}`);
      meta = { ...meta, periodo: per, at: nowISO(), by: st.me || null, n: mx.emps.length, chunks: n };
      setEmps(mx.emps);
    }
    if (cms.length) {
      const all = {}; cms.forEach((p) => { for (const k in p.comis) all[k] = { ...(all[k] || {}), ...p.comis[k] }; });
      const keys = Object.keys(all); const n = Math.ceil(keys.length / COM_CHUNK);
      for (let k = 0; k < n; k++) { const part = {}; keys.slice(k * COM_CHUNK, (k + 1) * COM_CHUNK).forEach((x) => { part[x] = all[x]; }); await store.set(`bases/com-${k}`, { c: part }); }
      for (let k = n; k < (meta.comisChunks || 0); k++) await store.del(`bases/com-${k}`);
      meta = { ...meta, comisChunks: n, comisN: keys.length, comisAt: nowISO() };
      st.comis = all; recomputeComis();
    }
    await store.set('bases/meta', meta); st.meta = meta;
    st.pending = []; toast('Base publicada.'); render();
  } catch (e) { toast(errMsg(e)); }
}

function fichaRows(A, B, s) {

  const anuL = [...new Map([...lab(A, 'anual'), ...lab(B, 'anual')].map((c) => [c.label, c])).values()];
  const ca = (M, l) => M.conc.filter((c) => c.tipo === 'anual' && c.label === l).reduce((x, c) => x + c.monto, 0);
  add('Sueldo base', A.base, B.base); add('Gratificación', A.grat, B.grat); add('Asig. antigüedad', A.antig, B.antig); add('Comisión (promedio)', A.comision, B.comision); add('Resalta (promedio)', A.resalta, B.resalta);
  add('Bono imponible', A.bonoImp, B.bonoImp); add(`Horas extra (${fmtN(s.heHrs, 1)} h)`, A.he, B.he);

    const rows = sec.rows.filter(([, a, b, cls]) => cls === 'tot' || a || b);
    if (!rows.length) continue;
    y = pdfSection(doc, W, y, sec.t);
    doc.autoTable({ ...PDF_TABLE, startY: y, head: [['Concepto', 'Actual', 'Propuesta', 'Diferencia', 'Var.']], columnStyles: { 0: { cellWidth: 'auto' }, 1: { halign: 'right', cellWidth: 82 }, 2: { halign: 'right', cellWidth: 82 }, 3: { halign: 'right', cellWidth: 76 }, 4: { halign: 'right', cellWidth: 50 } },
      body: rows.map(([l, a, b]) => [l, fmt(a), fmt(b), b - a ? fmtS(b - a) : '—', a && b - a ? fmtP(pctOf(b, a)) : '—']),
      didParseCell: (d) => { if (d.section === 'body' && rows[d.row.index]?.[3] === 'tot') { d.cell.styles.fontStyle = 'bold'; d.cell.styles.fillColor = PDF_SOFT; } } });
    y = doc.lastAutoTable.finalY + 18;
  }
  // Parámetros y firmas
  if (y > Hh - 150) { doc.addPage(); y = 50; }
  doc.setFont('helvetica', 'normal'); doc.setFontSize(7.6); doc.setTextColor(...PDF_MUTED);
  doc.text(doc.splitTextToSize(`Parámetros: IMM ${fmt(P.imm)} · tope gratificación mensual ${fmt(E.topeGrat(P))} (4,75 IMM ÷ 12) · UF ${fmt(P.uf)} · UTM ${fmt(P.utm)} · tope imponible ${P.topeAfpUF} UF. Comisión y resalta: promedio de los últimos ${P.mesesComision} periodos con ventas y presencias. Leyes sociales: aportes a cargo del empleador. Los conceptos con * fueron agregados en la simulación.`, W - 80), 40, y);
  y += 60;
  [['Preparado por', 40], ['Revisado por', 40 + (W - 80) / 3], ['Aprobado por', 40 + 2 * (W - 80) / 3]].forEach(([t, x]) => { doc.setDrawColor(...PDF_INK); doc.setLineWidth(0.6); doc.line(x, y, x + (W - 80) / 3 - 24, y); doc.setFontSize(8); doc.setTextColor(...PDF_MUTED); doc.text(t, x, y + 12); });
  pdfFooter(doc, 'Documento confidencial · Simulación referencial de remuneraciones');
  $('#toast').hidden = true;
  await saveFile(`propuesta-${slug(e.n)}.pdf`, doc.output('arraybuffer'));
}

/* Carga de logos: se redimensionan y guardan en la base compartida */
async function addLogo(file) {
  if (!file || !/^image\//.test(file.type)) return toast('Elige una imagen PNG o JPG.');
  const url = await new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(file); });
  const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
  const scale = Math.min(1, 160 / img.height, 640 / img.width);
  const cv = document.createElement('canvas'); cv.width = Math.round(img.width * scale); cv.height = Math.round(img.height * scale);
  cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
  const logos = [...(st.marca?.logos || []), { src: cv.toDataURL('image/png'), w: cv.width, h: cv.height }].slice(-3);
  st.marca = { logos };
  try { await store.set('params/marca', { logos, at: nowISO() }); toast('Logo agregado.'); } catch (e) { toast(errMsg(e)); }
  render();
}

        const mv = (col, kA, kB, mult = '') => PR.set(rr, col, { f: `${a(col - 1)}-${mult}SUMIF(${O},${a(2)},${DQ}!${rng(kA)})+${mult}SUMIF(${Dd},${a(2)},${DQ}!${rng(kB)})` }, S.mon);
        if (!Y) { mv(9, 'varA', 'varB'); mv(11, 'habA', 'habB'); mv(13, 'apA', 'apB'); }
        else { mv(9, 'varA', 'varB', '12*'); mv(11, 'habYA', 'habYB'); mv(13, 'apYA', 'apYB'); }
        PR.set(rr, 6, { f: `${a(10)}-${a(8)}` }, S.mon); PR.set(rr, 7, { f: `${a(11)}-${a(9)}` }, S.mon);
        PR.set(rr, 14, { f: `${a(10)}+${a(12)}` }, S.mon); PR.set(rr, 15, { f: `${a(11)}+${a(13)}` }, S.calc);
        PR.set(rr, 16, { f: `${a(15)}-${a(14)}` }, S.mon); PR.set(rr, 17, { f: `IF(${a(14)}=0,"",${a(15)}/${a(14)}-1)` }, S.pct3);
        y += 1;
      });
      const s1 = y - 1;
      if (!Y) { firstMonth = s0; incRange = `${ref(s0, 3, true)}:${ref(s1, 3, true)}`; impRows = [s0, s1]; }
      const colR = (k) => `${ref(s0, k)}:${ref(s1, k)}`;
      const totRow = (label, f) => { PR.set(y, 1, label, S.labB); PR.set(y, 2, null, S.txtB); PR.set(y, 3, null, S.txtB); for (let k = 4; k <= 16; k++) PR.set(y, k, { f: f(k) }, k <= 5 ? S.intB : S.monB); PR.set(y, 17, { f: `IF(${ref(y, 14)}=0,"",${ref(y, 15)}/${ref(y, 14)}-1)` }, S.pct3B); y += 1; return y - 1; };
      const varRow = (label, tr) => { PR.set(y, 1, label, S.lab); for (let k = 2; k <= 17; k++) PR.set(y, k, null, S.txt); for (const k of [5, 7, 9, 11, 13, 15]) PR.set(y, k, { f: `IF(${ref(tr, k - 1)}=0,"",${ref(tr, k)}/${ref(tr, k - 1)}-1)` }, S.pct3); y += 1; };
      const te = totRow('Total empresa', (k) => `SUM(${colR(k)})`);
      varRow('Variación % empresa', te);
      const ts = totRow('Total selección (Incluir = 1)', (k) => `SUMIF(${incRange},1,${colR(k)})`);
      varRow('Variación % selección', ts);
      y += 1;
    }
    PR.merge(y, 1, y, 17, 'Fijos: sueldo base, gratificación, antigüedad, asignaciones y bonos de convenio, bonos y otros conceptos fijos. Variables: comisión, resalta y horas extra (anual = 12 meses). Costos del empleador: leyes sociales a cargo de la empresa.', { sz: 8, color: MUT, wrap: 1 }); PR.height(y, 24);
    PR.list(incRange.replace(/\$/g, ''), ['1', '0']);
  }
  // nombre del centro de costo de destino (se actualiza si cambias el código)
  destName.forEach(([rr, nm]) => {
    if (impRows) D.set(rr, K.destN, { f: `IFERROR(INDEX(${PQ}!$B$${impRows[0] + 1}:$B$${impRows[1] + 1},MATCH(${ref(rr, K.dest)},${PQ}!$C$${impRows[0] + 1}:$C$${impRows[1] + 1},0)),"Revisar código")` }, S.txtM);
    else D.set(rr, K.destN, nm, S.txtM);
  });
  // orden de las hojas: con varias personas el detalle va primero
  B.sheets = n > 1 ? [D, PR, PS] : [PR, D, PS];
  try {
    const bytes = await B.toBytes();
    $('#toast').hidden = true;
    await saveFile(slug(meta.nombre || 'propuesta') + '.xlsx', bytes.buffer);
  } catch (e) { console.error(e); toast('No se pudo generar el Excel.'); }
}

<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Conectando con Microsoft</title>
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#07070f;color:#9097c4;font:14px/1.5 system-ui,sans-serif;padding-inline:16px}
  p{max-width:32em;text-align:center}
</style>
</head>
<body>
<p id="t">Conectando con Microsoft…</p>
<script>
/* Devuelve la respuesta de Microsoft a la herramienta que la pidió (misma página web, otra ventana o marco).
   Se usa BroadcastChannel porque Microsoft corta el vínculo entre ventanas; localStorage queda de respaldo. */
(function () {
  var msg = { url: location.href, t: Date.now() };
  try { var bc = new BroadcastChannel('cl-ms-auth'); bc.postMessage(msg); setTimeout(function () { bc.close(); }, 500); } catch (e) {}
  try { localStorage.setItem('cl-ms-auth', JSON.stringify(msg)); setTimeout(function () { localStorage.removeItem('cl-ms-auth'); }, 3000); } catch (e) {}
  try { history.replaceState(null, '', location.pathname); } catch (e) {}
  var err = /[?&]error=/.test(msg.url);
  document.getElementById('t').textContent = err ? 'Microsoft no completó el inicio de sesión. Puedes cerrar esta ventana y volver a intentarlo.' : 'Listo. Puedes cerrar esta ventana.';
  if (window.top === window.self) setTimeout(function () { window.close(); }, 600);
})();
</script>
</body>
</html>

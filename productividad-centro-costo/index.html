<script>
/* Motor de procesamiento: convierte las hojas (arrays de filas) en un resumen mensual por centro de costo.
   Sin dependencias: se usa igual en el navegador y en pruebas con Node. */
(function (root) {
  'use strict';

  // ---------- utilidades ----------
  const norm = (s) => String(s == null ? '' : s).normalize('NFD').replace(/[̀-ͯ]/g, '')
    .toLowerCase().replace(/\s+/g, ' ').trim();
  const num = (v) => {
    if (v == null || v === '') return 0;
    if (typeof v === 'number') return isFinite(v) ? v : 0;
    let s = String(v).replace(/;/g, '').trim();
    if (!s) return 0;
    if (/^-?\d{1,3}(\.\d{3})+(,\d+)?$/.test(s)) s = s.replace(/\./g, '').replace(',', '.');
    else if (/^-?\d+,\d+$/.test(s)) s = s.replace(',', '.');
    const n = Number(s);
    return isFinite(n) ? n : 0;
  };
  const r2 = (x) => Math.round(x * 100) / 100;
  const clean = (v) => String(v == null ? '' : v).replace(/;/g, '').trim();

  // Fechas como número de serie Excel (días enteros desde 1899-12-30)
  function serialOf(y, m, d) { return Math.round((Date.UTC(y, m - 1, d) - Date.UTC(1899, 11, 30)) / 86400000); }
  function ymdOf(serial) {
    const dt = new Date(Date.UTC(1899, 11, 30) + serial * 86400000);
    return { y: dt.getUTCFullYear(), m: dt.getUTCMonth() + 1, d: dt.getUTCDate() };
  }
  function toSerial(v) {
    if (v == null || v === '') return null;
    if (typeof v === 'number') return v > 20000 && v < 80000 ? Math.floor(v + 1e-9) : (v > 19000101 && v < 21001231 ? toSerial(String(v)) : null);
    if (v instanceof Date) return serialOf(v.getFullYear(), v.getMonth() + 1, v.getDate());
    const s = String(v).replace(/;/g, '').trim();
    let m;
    if ((m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))) return serialOf(+m[1], +m[2], +m[3]);
    if ((m = s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/))) { let y = +m[3]; if (y < 100) y += 2000; return serialOf(y, +m[2], +m[1]); }
    if ((m = s.match(/^(\d{4})(\d{2})(\d{2})(\.0+)?$/))) return serialOf(+m[1], +m[2], +m[3]);
    return null;
  }
  function monthRange(key) {
    const [y, m] = key.split('-').map(Number);
    const start = serialOf(y, m, 1);
    const end = serialOf(m === 12 ? y + 1 : y, m === 12 ? 1 : m + 1, 1) - 1;
    return { y, m, start, end, days: end - start + 1 };
  }
  const MESES = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
  function monthLabel(key) { const [y, m] = key.split('-').map(Number); const s = MESES[m - 1]; return s[0].toUpperCase() + s.slice(1) + ' ' + y; }
  const overlap = (a1, a2, b1, b2) => Math.max(0, Math.min(a2, b2) - Math.max(a1, b1) + 1);

  function normRut(s) {
    if (s == null) return '';
    let t = String(s).toUpperCase().replace(/,\d+(?=-)/, '').replace(/[^0-9K\-]/g, '');
    if (!t) return '';
    let body, dv;
    if (t.includes('-')) { const i = t.lastIndexOf('-'); body = t.slice(0, i).replace(/-/g, ''); dv = t.slice(i + 1); }
    else { body = t.slice(0, -1); dv = t.slice(-1); }
    body = body.replace(/^0+/, '');
    return body && dv ? body + '-' + dv : '';
  }
  const jKey = (j) => (j ? 'j' + j : 'sd');
  // clave de grupo: jornada|cargo (p.ej. 'j42|DEPENDIENTE/A')
  const gKey = (jor, cargo) => jKey(jor) + '|' + (String(cargo || '').trim() || 'Sin dato');
  function gParts(k) { const i = k.indexOf('|'); return i < 0 ? { j: k, cargo: 'Sin dato' } : { j: k.slice(0, i), cargo: k.slice(i + 1) }; }

  // ---------- detección de tipo de archivo ----------
  const TYPES = {
    ventas: 'Ventas por tienda', presencias: 'Presencias', activos: 'Activos del mes',
    ausentismos: 'Ausentismos', libro: 'Libro de remuneraciones', centralizacion: 'Centralización contable'
  };
  function findHeader(rows, test, maxScan) {
    const lim = Math.min(rows.length, maxScan || 30);
    for (let i = 0; i < lim; i++) {
      const r = rows[i] || [];
      const h = r.map(norm);
      if (test(h)) return { idx: i, h };
    }
    return null;
  }
  const has = (h, ...names) => names.every((n) => h.includes(n));
  const DETECTORS = [
    ['ventas', (h) => has(h, 'tienda', 'venta sin impuestos')],
    ['presencias', (h) => has(h, 'minutos', 'id local')],
    ['ausentismos', (h) => has(h, 'id persona', 'fechaini', 'fechafin') && (h.includes('d_codigo') || h.includes('codigo'))],
    ['activos', (h) => h.includes('id persona') && h.some((x) => x.includes('jornada_semanal'))],
    ['libro', (h) => has(h, 'rut', 'cencos') && h.some((x) => x.startsWith('total habere'))],
  ];
  function isCentralRow(r) {
    if (!r) return false;
    let semis = 0, dc = false;
    for (const c of r) { const s = String(c == null ? '' : c).trim(); if (s === ';') semis++; if (/^[DC];$/.test(s)) dc = true; }
    return semis >= 4 && dc;
  }
  function detectSheet(rows) {
    for (const [type, test] of DETECTORS) { const f = findHeader(rows, test); if (f) return { type, header: f }; }
    for (let i = 0; i < Math.min(rows.length, 15); i++) if (isCentralRow(rows[i])) return { type: 'centralizacion', header: { idx: i - 1, h: [] } };
    return null;
  }
  // workbook = { sheetName: rows[][] }
  function detectWorkbook(wb) {
    for (const name of Object.keys(wb)) { const d = detectSheet(wb[name]); if (d) return Object.assign({ sheet: name }, d); }
    return null;
  }
  function suggestMonth(type, rows, fileName) {
    const fn = String(fileName || '');
    let m = fn.match(/(20\d{2})(0[1-9]|1[0-2])(?!\d)/); if (m) return m[1] + '-' + m[2];
    m = fn.match(/(0[1-9]|1[0-2])(20\d{2})/); if (m) return m[2] + '-' + m[1];
    if (type === 'centralizacion') {
      for (let i = 0; i < Math.min(rows.length, 50); i++) for (const c of rows[i] || []) {
        const mm = String(c || '').match(/^\d{2}\/(\d{2})\/(\d{4});?$/); if (mm) return mm[2] + '-' + mm[1];
      }
    }
    return null;
  }

  function colIndex(h, ...cands) {
    for (const c of cands) { const i = h.indexOf(norm(c)); if (i >= 0) return i; }
    for (const c of cands) { const n = norm(c); const i = h.findIndex((x) => x.startsWith(n)); if (i >= 0) return i; }
    return -1;
  }
  function dataRows(rows, hdrIdx) {
    const out = [];
    for (let i = hdrIdx + 1; i < rows.length; i++) { const r = rows[i]; if (r && r.some((c) => c != null && c !== '')) out.push(r); }
    return out;
  }

  // ---------- parsers ----------
  function parseActivos(rows, hdr) {
    const h = hdr.h, R = dataRows(rows, hdr.idx);
    const c = {
      id: colIndex(h, 'id persona'), nom: colIndex(h, 'nombreabreviado', 'nombre abreviado'),
      alta: colIndex(h, 'fechaultimaalta'), baja: colIndex(h, 'fechaultimabaja'),
      cc: colIndex(h, 'cc_history/historico_tienda'), ccn: colIndex(h, 'd_history/historico_tienda'),
      cargo: colIndex(h, 'd_commission_puesto'), rut: colIndex(h, 'cc_datos_personales_rut'),
      jor: h.findIndex((x) => x.startsWith('cc_jornada_semanal')),
      base: colIndex(h, 'cc_salario_salario_mensual'), grat: h.findIndex((x) => x.startsWith('cc_salario_gratific')),
      est: colIndex(h, 'd_estado'),
    };
    const emps = [];
    for (const r of R) {
      const id = clean(r[c.id]); if (!id) continue;
      emps.push({
        id, rut: normRut(r[c.rut]), nom: clean(r[c.nom]).replace(/\s+/g, ' '), cc: clean(r[c.cc]), ccName: clean(r[c.ccn]),
        jor: num(r[c.jor]) || 0, base: num(r[c.base]), grat: c.grat >= 0 ? num(r[c.grat]) : 0,
        alta: toSerial(r[c.alta]), baja: toSerial(r[c.baja]), cargo: clean(r[c.cargo]),
        estado: clean(r[c.est])
      });
    }
    return emps;
  }

  function parseVentas(rows, hdr) {
    const h = hdr.h, R = dataRows(rows, hdr.idx);
    const c = {
      tienda: colIndex(h, 'tienda'), secc: colIndex(h, 'seccion'), fecha: colIndex(h, 'fecha'),
      ini: colIndex(h, 'fecha inicio'), fin: colIndex(h, 'fecha fin'), per: colIndex(h, 'periodo'),
      sin: colIndex(h, 'venta sin impuestos'), con: colIndex(h, 'venta con impuestos'),
      fis: colIndex(h, 'venta fisica sin impuestos'), cad: colIndex(h, 'cadena'),
    };
    return R.map((r) => ({
      cc: clean(r[c.tienda]), secc: clean(r[c.secc]) || 'SIN SECCIÓN', fecha: toSerial(r[c.fecha]),
      ini: toSerial(r[c.ini]), fin: toSerial(r[c.fin]), per: clean(r[c.per]), cad: clean(r[c.cad]),
      sin: num(r[c.sin]), con: num(r[c.con]), fis: c.fis >= 0 ? num(r[c.fis]) : 0
    })).filter((x) => x.cc && x.fecha != null);
  }

  function parsePresencias(rows, hdr) {
    const h = hdr.h, R = dataRows(rows, hdr.idx);
    const c = {
      id: colIndex(h, 'id local'), fecha: colIndex(h, 'fecha'), ini: colIndex(h, 'fecha inicio periodo'), fin: colIndex(h, 'fecha fin periodo'),
      cc: colIndex(h, 'id tienda origen'), secc: colIndex(h, 'seccion'), tipo: colIndex(h, 'tipo hora'), min: colIndex(h, 'minutos'),
      exT: colIndex(h, 'tipo hora excluido'), exP: colIndex(h, 'politicas excluido denominador'), dest: colIndex(h, 'incluido tienda destino'),
      emp: colIndex(h, 'empleado'), per: colIndex(h, 'periodo')
    };
    return R.map((r) => ({
      id: clean(r[c.id]), nom: c.emp >= 0 ? clean(r[c.emp]) : '', fecha: toSerial(r[c.fecha]), ini: toSerial(r[c.ini]), fin: toSerial(r[c.fin]),
      cc: clean(r[c.cc]), secc: clean(r[c.secc]) || 'SIN SECCIÓN', tipo: clean(r[c.tipo]), min: num(r[c.min]),
      excl: num(r[c.exT]) === 1 || num(r[c.exP]) === 1, dest: c.dest >= 0 && num(r[c.dest]) === 1, per: clean(r[c.per])
    })).filter((x) => x.cc && x.fecha != null);
  }

  function parseAusentismos(rows, hdr) {
    const h = hdr.h, R = dataRows(rows, hdr.idx);
    const c = {
      id: colIndex(h, 'id persona'), cod: colIndex(h, 'codigo'), desc: colIndex(h, 'd_codigo'),
      ini: colIndex(h, 'fechaini'), fin: colIndex(h, 'fechafin'), cc: colIndex(h, 'tienda'), ccn: colIndex(h, 'd_tienda'),
      rut: colIndex(h, 'cc_datos_personales_rut'), dias: colIndex(h, 'dias')
    };
    return R.map((r) => ({
      id: clean(r[c.id]), cod: clean(r[c.cod]), desc: clean(r[c.desc]) || clean(r[c.cod]),
      ini: toSerial(r[c.ini]), fin: toSerial(r[c.fin]), cc: clean(r[c.cc]), ccName: clean(r[c.ccn]), rut: normRut(r[c.rut])
    })).filter((x) => x.id && x.ini != null);
  }

  function parseLibro(rows, hdr) {
    const h = hdr.h, raw = rows[hdr.idx], R = dataRows(rows, hdr.idx);
    const c = { cod: colIndex(h, 'codigo'), rut: colIndex(h, 'rut'), cc: colIndex(h, 'cencos'), dias: colIndex(h, 'dias'), cargo: colIndex(h, 'cargo'), nom: colIndex(h, 'nombre'), lic: colIndex(h, 'klic') };
    let from = c.dias + 1, to = h.findIndex((x, i) => i > from && /^t\d{2,3}$/.test(x));
    if (to < 0) to = h.findIndex((x, i) => i > from && x === 'impo');
    if (to < 0) to = h.length;
    const items = [];
    for (let i = from; i < to; i++) {
      const label = String(raw[i] == null ? '' : raw[i]).trim(); if (!label) continue;
      if (R.some((r) => typeof r[i] === 'number' || (r[i] != null && r[i] !== '' && isFinite(num(r[i])) && num(r[i]) !== 0))) items.push({ i, id: 'L:' + label, label });
    }
    const out = R.map((r) => {
      const rut = normRut(c.cod >= 0 && r[c.cod] ? r[c.cod] : r[c.rut]);
      const vals = {}; for (const it of items) { const v = num(r[it.i]); if (v) vals[it.id] = v; }
      return { rut, nom: c.nom >= 0 ? clean(r[c.nom]).replace(/\s+/g, ' ') : '', cc: clean(r[c.cc]), dias: num(r[c.dias]), lic: c.lic >= 0 ? num(r[c.lic]) : 0, cargo: clean(r[c.cargo]), vals };
    }).filter((x) => x.rut);
    return { rows: out, items };
  }

  function parseCentralizacion(rows) {
    // ubica columnas por patrón en la primera fila de datos
    let sample = null;
    for (const r of rows) if (isCentralRow(r)) { sample = r; break; }
    if (!sample) return { rows: [], names: {} };
    const s = sample.map((x) => String(x == null ? '' : x).trim());
    const iDC = s.findIndex((x) => /^[DC];$/.test(x));
    const iCta = s.findIndex((x) => /^\d{6,9}\s*;$/.test(x));
    const iRut = s.findIndex((x) => /^\d{6,8}-[\dK]$/i.test(x));
    const iMonto = iDC - 1, iCon = iDC - 2, iId = iDC - 3;
    const iCC = iCta + 1;
    // nombre de cuenta y de CC: primeros textos no ';' después del CC
    const txt = []; for (let i = iCC + 1; i < iId; i++) if (s[i] && s[i] !== ';' && !/^\d+$/.test(s[i]) && s[i] !== 'CPO.AUX.CO') txt.push(i);
    const iCtaN = txt[0], iCCN = txt[1];
    const out = [], names = {};
    for (const r of rows) {
      if (!isCentralRow(r)) continue;
      const cta = clean(r[iCta]); const dc = clean(r[iDC]);
      const cc = clean(r[iCC]); const ccName = iCCN != null ? clean(r[iCCN]) : '';
      if (cc && ccName && !names[cc]) names[cc] = ccName;
      out.push({ cta, ctaName: iCtaN != null ? clean(r[iCtaN]) : '', cc, con: clean(r[iCon]), id: clean(r[iId]), monto: num(r[iMonto]), dc, rut: normRut(r[iRut]) });
    }
    return { rows: out, names };
  }

  // ---------- etiquetas y clasificación por defecto ----------
  const CENT_LABELS = {
    SISAFP: 'SIS – Seguro de invalidez y sobrevivencia', MUTUAL: 'Mutual / Ley 16.744', LSANNA: 'Ley SANNA',
    SEGCEE: 'Seguro de cesantía empleador (SEGCEE)', SEGCEI: 'Seguro de cesantía empleador (SEGCEI)',
    COCAPI: 'Reforma previsional: capitalización individual', COSESO: 'Reforma previsional: seguro social', CORENP: 'Reforma previsional: CORENP'
  };
  const CATS = {
    FIJO: 'Fijo', VARIABLE: 'Variable', ESPOR: 'Esporádicos', INDEM: 'Indemnizaciones', LEYES: 'Leyes sociales empleador', CONTRIB: 'Contribución empleador',
    LST: 'Leyes sociales trabajador (informativo)', DESC: 'Descuento trabajador (informativo)', NC: 'No considerar'
  };
  function defaultItemCat(id, meta) {
    if (id.startsWith('C:')) {
      const code = id.slice(2);
      if (['COCAPI', 'COSESO', 'CORENP'].includes(code)) return 'CONTRIB';
      if (meta && String(meta.cta || '').startsWith('614')) return 'LEYES';
      return 'NC';
    }
    const n = norm(id.slice(2));
    const any = (...k) => k.some((x) => n.startsWith(x));
    if (any('total', 'afecto')) return 'NC';
    if (any('s. base', 'sueldo base', 'gratific', 'antiguedad', 'dif sueldo', 'asignacion c', 'diferencia suel', 'salacuna', 'sala cuna', 'asig. teletrabajo', 'colacion', 'movilizacion')) return 'FIJO';
    if (any('asignacion f')) return 'NC';
    if (any('aportes empleador', 'reforma previsional')) return 'NC';
    if (any('indemni', 'indemini')) return 'INDEM';
    if (any('aguinaldo', 'nacimiento', 'vacaciones fini', 'bono term', 'bono vacasind', 'incentivo anual', 'fallecimiento')) return 'ESPOR';
    if (any('comision', 'resalta', 'feriado vacaci', 'recargo dom', 'bono', 'otros habere', 'incentivo', 'horas extra', 'hora extra', 'sobretiempo')) return 'VARIABLE';
    if (any('prevision', 'isapre', 'fonasa', 'cesantia tra')) return 'LST';
    if (any('ahorro', 'apv', 'salud', 'impuesto', 'anticipo', 'retencion', 'cuota', 'comite', 'sind', 'descuento', 'seguro', 'sobregiro', 'ccaf', 'anti termi', 'otros descue', 'prestamo')) return 'DESC';
    return 'NC';
  }
  function defaultAusTrat(desc) {
    const n = norm(desc);
    if (/retraso|atraso/.test(n)) return 'EXCL';
    if (/funeral|fallec|administrativ|matrimon|nacimiento|vacacion/.test(n)) return 'PAG';
    return 'DESC';
  }
  function defaultConfig() {
    return {
      v: 3,
      items: {},            // id -> categoría
      aus: {},              // código -> PAG | DESC | EXCL
      groups: [],           // {id, name, ccs:[]}
      ccNames: {},          // alias opcional por CC
      totalCats: ['FIJO', 'VARIABLE', 'ESPOR', 'INDEM', 'LEYES', 'CONTRIB'],
      params: {
        ventaTipo: 'sin',          // 'sin' | 'con' impuestos
        excluirHoras: true,        // excluye horas marcadas como excluidas del denominador
        fteBase: 42,               // jornada para calcular FTE
        jorDefault: 42,            // jornada si la persona no está en activos
        commissionItem: 'L:Comisión',
        fallbackLibroAportes: true,
        projFrom: [42], projTo: 40, projVarModo: 'HORA'
      }
    };
  }

  // ---------- procesamiento del mes ----------
  // files: { ventas:{rows,header}, presencias:..., activos:..., ausentismos:..., libro:..., centralizacion:... }
  function processMonth(files, key) {
    const M = monthRange(key);
    const warn = [];
    const ccNames = {};
    const cat = { items: {}, aus: {} };
    const doc = { key, label: monthLabel(key), days: M.days, files: {}, ventas: {}, horas: {}, dot: {}, aus: {}, cat, ccNames, warn, has: {} };
    const cost = { key, cc: {}, extra: {} };
    const daily = { key, days: M.days, start: M.start, cc: {} };
    const DY = (cc) => (daily.cc[cc] = daily.cc[cc] || { v: new Array(M.days).fill(0), vc: new Array(M.days).fill(0), h: {}, x: new Array(M.days).fill(0), t: {}, a: {} });
    const arr = () => new Array(M.days).fill(0);
    // detalle por persona
    const PP = new Map();
    const person = (id, init) => { let x = PP.get(id); if (!x) { x = Object.assign({ id, n: '', cc: '', c: '', j: 0, b: 0, g: 0, dAct: 0, ht: 0, hm: [0, 0], hc: [0, 0], a: {}, i: {}, dl: 0, lic: 0 }, init || {}); PP.set(id, x); } return x; };

    // Activos
    const empById = new Map(), empByRut = new Map();
    if (files.activos) {
      const emps = parseActivos(files.activos.rows, files.activos.header);
      doc.has.activos = true; doc.files.activos = { name: files.activos.name, n: emps.length };
      for (const e of emps) {
        empById.set(e.id, e); if (e.rut) empByRut.set(e.rut, e);
        if (e.cc && e.ccName) ccNames[e.cc] = ccNames[e.cc] || e.ccName;
        const bajaEf = e.baja != null && (e.alta == null || e.baja >= e.alta) ? e.baja : null;
        const ini = e.alta != null ? e.alta : M.start, fin = bajaEf != null ? bajaEf : M.end;
        const dAct = overlap(ini, fin, M.start, M.end);
        if (!dAct) continue;
        person(e.id, { n: e.nom, cc: e.cc, c: e.cargo, j: e.jor, b: e.base, g: e.grat, dAct, ht: (e.jor || 0) * dAct / 7, alta: e.alta, baja: bajaEf });
        const cc = e.cc || 'SIN CC', j = gKey(e.jor, e.cargo);
        const d = (doc.dot[cc] = doc.dot[cc] || {});
        const g = (d[j] = d[j] || { n: 0, nFin: 0, dAct: 0, hTeo: 0, base: 0, grat: 0, altas: 0, bajas: 0 });
        g.n++; g.dAct += dAct; g.hTeo += (e.jor || 0) * dAct / 7;
        if (e.jor) { const dt = DY(cc).t; const a = (dt[j] = dt[j] || arr()); for (let x = Math.max(ini, M.start); x <= Math.min(fin, M.end); x++) a[x - M.start] += e.jor / 7; }
        if (fin >= M.end) { g.nFin++; g.base += e.base; g.grat += e.grat; }
        if (e.alta != null && e.alta >= M.start && e.alta <= M.end) g.altas++;
        if (bajaEf != null && bajaEf >= M.start && bajaEf <= M.end) g.bajas++;
      }
      for (const cc in doc.dot) for (const j in doc.dot[cc]) { const g = doc.dot[cc][j]; g.hTeo = r2(g.hTeo); }
    } else warn.push('Falta el archivo de activos: sin jornadas no se calculan horas teóricas, FTE ni proyección.');

    const jorOf = (e) => (e && e.jor) || 0;
    const gOf = (e, cargo) => gKey(jorOf(e), (e && e.cargo) || cargo);

    // Ventas
    if (files.ventas) {
      const V = parseVentas(files.ventas.rows, files.ventas.header);
      doc.has.ventas = true; doc.files.ventas = { name: files.ventas.name, n: V.length };
      let comLabel = '', comIni = null, comFin = null, mesMin = null, mesMax = null;
      const diasVenta = new Set();
      for (const v of V) {
        const inCom = v.fin != null && v.fin >= M.start && v.fin <= M.end;
        const inMes = v.fecha >= M.start && v.fecha <= M.end;
        if (!inCom && !inMes) continue;
        const t = (doc.ventas[v.cc] = doc.ventas[v.cc] || { com: { sin: 0, con: 0, fis: 0 }, mes: { sin: 0, con: 0, fis: 0 }, secc: {}, cad: v.cad });
        const s = (t.secc[v.secc] = t.secc[v.secc] || [0, 0, 0, 0]);
        if (inCom) { t.com.sin += v.sin; t.com.con += v.con; t.com.fis += v.fis; s[0] += v.sin; s[1] += v.con; comLabel = v.per; comIni = v.ini; comFin = v.fin; }
        if (inMes) { const dy = DY(v.cc); dy.v[v.fecha - M.start] += v.sin; dy.vc[v.fecha - M.start] += v.con; t.mes.sin += v.sin; t.mes.con += v.con; t.mes.fis += v.fis; s[2] += v.sin; s[3] += v.con; if (v.sin > 0) diasVenta.add(v.fecha); mesMin = Math.min(mesMin == null ? 1e9 : mesMin, v.fecha); mesMax = Math.max(mesMax || 0, v.fecha); }
      }
      for (const cc in doc.ventas) { const t = doc.ventas[cc]; ['com', 'mes'].forEach((k) => { for (const f in t[k]) t[k][f] = Math.round(t[k][f]); }); for (const s in t.secc) t.secc[s] = t.secc[s].map(Math.round); }
      doc.periodoCom = { label: comLabel, ini: comIni, fin: comFin };
      doc.ventasCobertura = { ini: mesMin, fin: mesMax };
      if (mesMin != null) { let sv = 0; for (let d = mesMin; d <= mesMax; d++) if (!diasVenta.has(d)) sv++; doc.diasSinVenta = sv; doc.feriados = sv; }
      if (comIni == null) warn.push('Ventas: no encontré el periodo de comisión que termina en ' + doc.label + ' (21 del mes anterior al 20).');
      if (mesMax != null && mesMax < M.end) warn.push('Ventas: el mes calendario llega solo hasta el día ' + ymdOf(mesMax).d + '.');
      if (mesMin != null && mesMin > M.start) warn.push('Ventas: el mes calendario parte el día ' + ymdOf(mesMin).d + '.');
    } else warn.push('Falta el archivo de ventas.');

    // Presencias
    if (files.presencias) {
      const P = parsePresencias(files.presencias.rows, files.presencias.header);
      doc.has.presencias = true; doc.files.presencias = { name: files.presencias.name, n: P.length };
      const sinActivo = new Set(), empMes = {};
      let pMin = null, pMax = null;
      for (const p of P) {
        const inCom = p.fin != null && p.fin >= M.start && p.fin <= M.end;
        const inMes = p.fecha >= M.start && p.fecha <= M.end;
        if (!inCom && !inMes) continue;
        const e = empById.get(p.id); if (!e && empById.size) sinActivo.add(p.id);
        const j = gOf(e);
        const hh = p.min / 60;
        { const pr = person(p.id, { n: p.nom, cc: p.cc }); if (inMes) { pr.hm[0] += hh; if (!p.excl) pr.hm[1] += hh; } if (inCom) { pr.hc[0] += hh; if (!p.excl) pr.hc[1] += hh; } }
        const t = (doc.horas[p.cc] = doc.horas[p.cc] || { com: { tot: 0, prod: 0 }, mes: { tot: 0, prod: 0, prest: 0, excl: 0 }, secc: {}, byG: {}, emp: 0 });
        const b = (t.byG[j] = t.byG[j] || [0, 0, 0, 0]); // [mes tot, mes prod, com tot, com prod]
        const s = (t.secc[p.secc] = t.secc[p.secc] || [0, 0, 0, 0]); // [com tot, com prod, mes tot, mes prod]
        if (inCom) { t.com.tot += hh; if (!p.excl) t.com.prod += hh; s[0] += hh; if (!p.excl) s[1] += hh; b[2] += hh; if (!p.excl) b[3] += hh; }
        if (inMes) {
          t.mes.tot += hh; if (!p.excl) t.mes.prod += hh; else t.mes.excl += hh;
          const foraneo = p.dest || (e && e.cc && e.cc !== p.cc);
          if (foraneo) t.mes.prest += hh;
          s[2] += hh; if (!p.excl) s[3] += hh;
          b[0] += hh; if (!p.excl) b[1] += hh;
          { const dy = DY(p.cc); if (p.excl) dy.x[p.fecha - M.start] += hh; else { const a = (dy.h[j] = dy.h[j] || arr()); a[p.fecha - M.start] += hh; } }
          (empMes[p.cc] = empMes[p.cc] || new Set()).add(p.id);

        }
      }
      for (const cc in doc.horas) {
        const t = doc.horas[cc];
        ['com', 'mes'].forEach((k) => { for (const f in t[k]) t[k][f] = r2(t[k][f]); });
        for (const s in t.secc) t.secc[s] = t.secc[s].map(r2);

      }
      doc.presCobertura = { ini: pMin, fin: pMax };
      if (sinActivo.size) warn.push('Presencias: ' + sinActivo.size + ' persona(s) no están en activos (se usa la jornada por defecto en la proyección).');

    } else warn.push('Falta el archivo de presencias.');

    // Ausentismos
    if (files.ausentismos) {
      const A = parseAusentismos(files.ausentismos.rows, files.ausentismos.header);
      doc.has.ausentismos = true; doc.files.ausentismos = { name: files.ausentismos.name, n: A.length };
      const pers = {};
      for (const a of A) {
        const fin = a.fin != null ? a.fin : a.ini;
        const d = overlap(a.ini, fin, M.start, M.end); if (!d) continue;
        const e = empById.get(a.id) || (a.rut && empByRut.get(a.rut));
        const cc = a.cc || (e && e.cc) || 'SIN CC';
        if (a.ccName && !ccNames[cc]) ccNames[cc] = a.ccName;
        cat.aus[a.cod] = a.desc;
        const jor = jorOf(e);
        const t = (doc.aus[cc] = doc.aus[cc] || {});
        const g = (t[a.cod] = t[a.cod] || { d: 0, h: 0, n: 0, p: 0, v: 0, hsj: 0, by: {} });
        { const pr = person(a.id, { cc }); const pa = (pr.a[a.cod] = pr.a[a.cod] || [0, 0]); pa[0] += d; pa[1] += (jor || 42) * d / 7; }
        const gk = gOf(e); const gb = (g.by[gk] = g.by[gk] || [0, 0, 0, 0, 0]); // [días, horas, valor, registros, personas]
        g.d += d; g.n++; gb[0] += d; gb[3]++;
        if (jor) { g.h += jor * d / 7; gb[1] += jor * d / 7; } else g.hsj += d;
        { const da = DY(cc).a; const dc = (da[a.cod] = da[a.cod] || {}); const o = (dc[gk] = dc[gk] || {}); const hd = (jor || 42) / 7; for (let x = Math.max(a.ini, M.start); x <= Math.min(fin, M.end); x++) { const i = x - M.start; o[i] = (o[i] || 0) + hd; } } // días sin jornada conocida: se valorizan con la jornada por defecto en pantalla
        if (e) { g.v += (e.base + e.grat) / 30 * d; gb[2] += (e.base + e.grat) / 30 * d; }
        const pk = cc + '|' + a.cod; (pers[pk] = pers[pk] || new Set()).add(a.id);
        const pk2 = pk + '|' + gk; (pers[pk2] = pers[pk2] || new Set()).add(a.id);
      }
      for (const cc in doc.aus) for (const k in doc.aus[cc]) { const g = doc.aus[cc][k]; g.h = r2(g.h); g.v = Math.round(g.v); g.p = pers[cc + '|' + k].size; for (const gk in g.by) { const b = g.by[gk]; b[1] = r2(b[1]); b[2] = Math.round(b[2]); b[4] = pers[cc + '|' + k + '|' + gk].size; } }

    // Libro de remuneraciones
    const rutCC = new Map(), rutCargo = new Map(), rutKey = new Map();
    if (files.libro) {

      for (const it of L.items) cat.items[it.id] = { label: it.label, src: 'L' };
      let sinAct = 0;
      const lib = (doc.libro = {});
      L.rows.forEach((r, li) => {
        const pk = (empByRut.get(r.rut) || {}).id || ('L' + li); rutKey.set(r.rut, pk);
        { const pr = person(pk, { n: r.nom, cc: r.cc, c: r.cargo }); pr.cc = r.cc || pr.cc; if (!pr.n) pr.n = r.nom; if (!pr.c) pr.c = r.cargo; pr.dl += r.dias; pr.lic += r.lic; for (const id in r.vals) pr.i[id] = (pr.i[id] || 0) + r.vals[id]; }
        rutCC.set(r.rut, r.cc); rutCargo.set(r.rut, r.cargo);
        const e = empByRut.get(r.rut); if (!e && empByRut.size) sinAct++;
        const cc = r.cc || (e && e.cc) || 'SIN CC', j = gOf(e, r.cargo);
        const cj = ((cost.cc[cc] = cost.cc[cc] || {})[j] = cost.cc[cc][j] || {});
        for (const id in r.vals) cj[id] = (cj[id] || 0) + r.vals[id];
        const lb = (lib[cc] = lib[cc] || { n: 0, dias: 0, lic: 0 }); lb.n++; lb.dias += r.dias; lb.lic += r.lic;
      });
      if (sinAct) warn.push('Libro: ' + sinAct + ' RUT no están en activos (su costo queda en jornada "sin dato").');
    } else warn.push('Falta el libro de remuneraciones.');

    // Centralización contable: solo cuentas de gasto (6xxxxxx). Débito suma, crédito resta.
    if (files.centralizacion) {
      const C = parseCentralizacion(files.centralizacion.rows);
      doc.has.centralizacion = true; doc.files.centralizacion = { name: files.centralizacion.name, n: C.rows.length };
      for (const cc in C.names) if (!ccNames[cc]) ccNames[cc] = C.names[cc];
      let deb = 0, cre = 0;
      for (const l of C.rows) {
        if (l.dc === 'D') deb += l.monto; else cre += l.monto;
        if (!/^6/.test(l.cta)) continue;
        const id = 'C:' + l.con;
        if (!cat.items[id]) cat.items[id] = { label: CENT_LABELS[l.con] || (l.con + ' · ' + (l.ctaName || l.cta)), src: 'C', cta: l.cta, ctaName: l.ctaName };
        const e = empByRut.get(l.rut);
        const cc = rutCC.get(l.rut) || l.cc || 'SIN CC', j = gOf(e, rutCargo.get(l.rut));
        const cj = ((cost.cc[cc] = cost.cc[cc] || {})[j] = cost.cc[cc][j] || {});
        cj[id] = (cj[id] || 0) + (l.dc === 'D' ? l.monto : -l.monto);
        { const pk = rutKey.get(l.rut) || (e && e.id); if (pk) { const pr = person(pk, { cc }); pr.i[id] = (pr.i[id] || 0) + (l.dc === 'D' ? l.monto : -l.monto); } }
      }
      doc.centralCuadre = { debe: Math.round(deb), haber: Math.round(cre) };
      if (Math.abs(deb - cre) > 1) warn.push('Centralización: el asiento no cuadra (debe ' + Math.round(deb) + ' vs haber ' + Math.round(cre) + ').');
    } else warn.push('Falta la centralización contable: las cargas del empleador se tomarán del libro (si está activado en Configuración).');

    // compacta: los ítems se guardan como índice de cost.items para que el documento sea liviano

    for (const cc in cost.cc) for (const j in cost.cc[cc]) {

      cost.cc[cc][j] = o;
    }
    // redondeo y días sin venta (tiendas cerradas)
    const tot = arr();
    const rd = (a) => a.map((x) => Math.round(x * 10) / 10);
    for (const cc in daily.cc) {
      const dy = daily.cc[cc];
      dy.v.forEach((x, i) => { tot[i] += x; }); dy.v = dy.v.map(Math.round); dy.vc = dy.vc.map(Math.round); dy.x = rd(dy.x);
      for (const k in dy.h) dy.h[k] = rd(dy.h[k]);

      x.i = o; x.ht = r2(x.ht); x.hm = x.hm.map(r2); x.hc = x.hc.map(r2); for (const c in x.a) x.a[c] = [x.a[c][0], r2(x.a[c][1])];

  }

  // ---------- métricas ----------

  // Suma métricas de un conjunto de CC para un mes.

  function metrics(month, cost, cfg, ccs, filt) {

    const m = {

      ausD: { PAG: 0, DESC: 0, EXCL: 0 }, ausH: { PAG: 0, DESC: 0, EXCL: 0 }, ausV: { PAG: 0, DESC: 0, EXCL: 0 }, ausByCode: {},

    const G = (k) => (m.G[k] = m.G[k] || { n: 0, hTeo: 0, hMes: 0, hCom: 0, ausPag: 0, ausDesc: 0, ausD: 0, total: 0, fijo: 0, variable: 0, cargas: 0, base: 0, grat: 0 });

      const v = month.ventas && month.ventas[cc];
      if (v) { m.ventaMes += v.mes[vt]; m.ventaCom += v.com[vt]; m.ventaFis += v.mes.fis; }
      const h = month.horas && month.horas[cc];
      if (h) {
        if (!filtered) m.hPrest += h.mes.prest || 0;
        const by = h.byG || h.byJ;
        if (by) for (const k in by) {
          if (!match(k)) continue;
          const b = by[k], gp = gParts(k);
          const hm = b[ex], hc = b.length > 2 ? b[2 + ex] : 0;
          m.hMes += hm; m.hCom += hc; J(gp.j).hPres += hm; const g = G(k); g.hMes += hm; g.hCom += hc;
        }

      if (d) for (const k in d) {
        if (!match(k)) continue;
        const g = d[k], gp = gParts(k);

        const y = G(k); y.n += g.nFin; y.hTeo += g.hTeo * ferF; y.base += g.base; y.grat += g.grat;
      }

        const g = a[code], t = ausTrat(cfg, code, month.cat.aus[code]);

        if (g.by) {

      cobertura: div(m.hMes, m.hTeo), ausPct: div(m.ausHT, m.hTeo), ausPagPct: div(m.ausH.PAG, m.hTeo), ausDescPct: div(m.ausH.DESC, m.hTeo),

  }

  // Serie diaria para un conjunto de CC (y filtro cargo/jornada). El gasto mensual se reparte así:
  // la parte fija (fijo + su proporción de cargas) por día calendario; la variable (variable + su
  // proporción de cargas) según las horas trabajadas de cada día.
  function dailySeries(month, daily, m, cfg, ccs, filt) {
    if (!daily || !daily.cc) return null;
    const P = cfg.params, n = daily.days, closed = new Set((+month.feriados || 0) > 0 ? daily.closed || [] : []);
    const fC = filt && filt.cargos && filt.cargos.length ? new Set(filt.cargos) : null;
    const fJ = filt && filt.jors && filt.jors.length ? new Set(filt.jors) : null;
    const filtered = !!(fC || fJ);
    const match = (k) => { if (!filtered) return true; const g = gParts(k); return (!fC || fC.has(g.cargo)) && (!fJ || fJ.has(g.j)); };
    const out = []; for (let i = 0; i < n; i++) out.push({ i, serial: daily.start + i, v: 0, h: 0, teo: 0, ausPag: 0, ausDesc: 0, closed: closed.has(i) });
    const vk = P.ventaTipo === 'con' ? 'vc' : 'v';
    for (const cc of ccs) {
      const dy = daily.cc[cc]; if (!dy) continue;
      for (let i = 0; i < n; i++) { out[i].v += dy[vk][i] || 0; if (!P.excluirHoras && !filtered) out[i].h += dy.x[i] || 0; }
      for (const k in dy.h) if (match(k)) { const a = dy.h[k]; for (let i = 0; i < n; i++) out[i].h += a[i] || 0; }
      for (const k in dy.t) if (match(k)) { const a = dy.t[k]; for (let i = 0; i < n; i++) if (!closed.has(i)) out[i].teo += a[i] || 0; }
      for (const code in dy.a) {
        const t = ausTrat(cfg, code, month.cat.aus[code]); if (t === 'EXCL') continue;
        for (const k in dy.a[code]) if (match(k)) { const o = dy.a[code][k]; for (const i in o) { if (t === 'PAG') out[+i].ausPag += o[i]; else out[+i].ausDesc += o[i]; } }
      }
    }
    // reparto del gasto
    const fijo = m.cat.FIJO + m.cat.ESPOR, variable = m.cat.VARIABLE, cargas = m.cat.LEYES + m.cat.CONTRIB;
    const shareF = fijo + variable ? fijo / (fijo + variable) : 1;
    const tc = new Set(cfg.totalCats || ['FIJO', 'VARIABLE', 'ESPOR', 'INDEM', 'LEYES', 'CONTRIB']);
    const cf = (tc.has('FIJO') ? m.cat.FIJO : 0) + (tc.has('ESPOR') ? m.cat.ESPOR : 0) + (tc.has('INDEM') ? m.cat.INDEM : 0) + ((tc.has('LEYES') ? m.cat.LEYES : 0) + (tc.has('CONTRIB') ? m.cat.CONTRIB : 0)) * shareF;
    const cv = (tc.has('VARIABLE') ? variable : 0) + ((tc.has('LEYES') ? m.cat.LEYES : 0) + (tc.has('CONTRIB') ? m.cat.CONTRIB : 0)) * (1 - shareF);
    const hTot = out.reduce((s, d) => s + d.h, 0);
    for (const d of out) d.cost = cf / n + (hTot ? cv * d.h / hTot : 0);
    return out;
  }
  // Métricas de una persona (o de una lista de personas) con la misma lógica que las de CC
  function peopleMetrics(list, month, cost, cfg) {
    const P = cfg.params, ex = P.excluirHoras ? 1 : 0;
    const ferF = month.days ? Math.max(0, month.days - (+month.feriados || 0)) / month.days : 1;

}

  if (S.filt.cargos.length) p.push(S.filt.cargos.length <= 3 ? S.filt.cargos.join(', ') : S.filt.cargos.length + ' cargos');
  return p.join(' · ');
}
function filterStrip() {
  return '<div class="alert warn" style="align-items:center"><span>⚑</span><div style="flex:1"><b>Filtro activo:</b> ' + esc(filterDesc()) + '. Horas, dotación, ausentismo y gasto son solo de ese grupo; la venta es la de la tienda completa.</div><button class="btn sm" data-go="resumen">Editar</button><button class="btn sm" data-act="fclear">Quitar filtro</button></div>';
}
function filterPanel() {
  const key = S.month, ccs = entityCCs(S.ent, key);
  const base = M(key, ccs, true); // sin filtro: para listar opciones con su dotación
  const byC = {}, byJ = {};
  for (const k in base.G) { const g = base.G[k], gp = E.gParts(k); if (!g.n && !g.hMes && !g.hTeo) continue; byC[gp.cargo] = (byC[gp.cargo] || 0) + g.n; byJ[gp.j] = (byJ[gp.j] || 0) + g.n; }
  const cargos = Object.entries(byC).sort((a, b) => b[1] - a[1]);
  const shown = S.showAllCargos ? cargos : cargos.filter(([c], i) => i < 12 || S.filt.cargos.includes(c));
  const jors = Object.entries(byJ).sort((a, b) => (b[0] === 'sd' ? -1 : +b[0].slice(1)) - (a[0] === 'sd' ? -1 : +a[0].slice(1)));
  return '<section class="panel"><div class="ph"><div><h2>Cargo y jornada</h2><p class="sub">Filtra todo el tablero por uno o varios cargos y jornadas, combinado con la vista de tiendas o grupos. La venta no se registra por cargo: se usa la venta completa de las tiendas y se divide por las horas del grupo filtrado.</p></div>' +
    (filtOn() ? '<button class="btn sm" data-act="fclear">Quitar filtro</button>' : '') + '</div>' +
    '<div class="ctl" style="margin-bottom:10px"><label>Jornada</label><div class="chips">' + jors.map(([j, n]) => '<button data-act="fjor" data-v="' + esc(j) + '" aria-pressed="' + S.filt.jors.includes(j) + '">' + esc(jLabel(j)) + ' · ' + F.int(n) + '</button>').join('') + '</div></div>' +
    '<div class="ctl"><label>Cargo</label><div class="chips">' + shown.map(([c, n]) => '<button data-act="fcargo" data-v="' + esc(c) + '" aria-pressed="' + S.filt.cargos.includes(c) + '">' + esc(c) + ' · ' + F.int(n) + '</button>').join('') +
    (cargos.length > 12 ? '<button data-act="fall" aria-pressed="false">' + (S.showAllCargos ? 'Ver menos' : 'Ver los ' + cargos.length + ' cargos') + '</button>' : '') + '</div></div>' +
    (filtOn() ? '<p class="note" style="margin-top:12px">Mostrando: <b>' + esc(filterDesc()) + '</b> en ' + esc(entName(S.ent)) + '.</p>' : '') + '</section>';
}
function groupPanel(m) {
  const by = S.grpBy;
  const agg = {};
  for (const k in m.G) {
    const g = m.G[k], gp = E.gParts(k), id = by === 'cargo' ? gp.cargo : gp.j;
    const a = (agg[id] = agg[id] || { n: 0, hTeo: 0, hMes: 0, aus: 0, ausPag: 0, ausDesc: 0, total: 0, fijo: 0, variable: 0 });
    a.n += g.n; a.hTeo += g.hTeo; a.hMes += g.hMes; a.ausPag += g.ausPag; a.ausDesc += g.ausDesc; a.aus += g.ausPag + g.ausDesc; a.total += g.total; a.fijo += g.fijo; a.variable += g.variable;
  }
  const rows = Object.entries(agg).filter(([, a]) => a.n || a.hMes || a.hTeo).sort((x, y) => by === 'cargo' ? y[1].hMes - x[1].hMes : (y[0] === 'sd' ? -1 : +y[0].slice(1)) - (x[0] === 'sd' ? -1 : +x[0].slice(1)));
  const V = m.ventaMes, dv = (a, b) => (b ? a / b : null);
  const sel = by === 'cargo' ? S.filt.cargos : S.filt.jors;

  const cols = '<th class="n">Dotación</th><th class="n">HH contratadas</th><th class="n">HH aus. pagadas</th><th class="n">HH aus. descontadas</th><th class="n">Ausentismo</th><th class="n">HH trabajadas</th><th class="n">Trabajadas / contratadas</th><th class="n">Venta / HH contratada</th><th class="n">Venta / HH trabajada</th><th class="n">Gasto</th><th class="n">Fijo / HH</th><th class="n">Variable / HH</th><th class="n">Gasto / HH</th>';
  const cells = (a) => '<td class="n">' + F.int(a.n) + '</td><td class="n">' + F.int(a.hTeo) + '</td><td class="n">' + F.int(a.ausPag) + '</td><td class="n">' + F.int(a.ausDesc) + '</td><td class="n">' + F.pct(dv(a.aus, a.hTeo)) + '</td><td class="n">' + F.int(a.hMes) + '</td><td class="n">' + F.pct(dv(a.hMes, a.hTeo)) + '</td><td class="n">' + F.clp(dv(V, a.hTeo)) + '</td><td class="n">' + F.clp(dv(V, a.hMes)) + '</td><td class="n">' + F.mm(a.total) + '</td><td class="n">' + F.clp(dv(a.fijo, a.hMes)) + '</td><td class="n">' + F.clp(dv(a.variable, a.hMes)) + '</td><td class="n">' + F.clp(dv(a.total, a.hMes)) + '</td>';
  const T = rows.reduce((t, [, a]) => { for (const k in a) t[k] = (t[k] || 0) + a[k]; return t; }, {});
  return '<section class="panel"><div class="ph"><div><h2>Productividad por ' + (by === 'cargo' ? 'cargo' : 'jornada') + '</h2><p class="sub">' + esc(entName(S.ent)) + (filtOn() ? ' · ' + esc(filterDesc()) : '') + '. Venta de la vista (' + F.mm(V) + ') dividida por las horas de cada grupo. Haz clic en una fila para filtrar el tablero por ese ' + (by === 'cargo' ? 'cargo' : 'jornada') + '.</p></div>' +
    '<div class="chips"><button data-act="grpby" data-v="cargo" aria-pressed="' + (by === 'cargo') + '">Por cargo</button><button data-act="grpby" data-v="jor" aria-pressed="' + (by !== 'cargo') + '">Por jornada</button></div></div>' +
    '<div class="tbl-wrap" style="max-height:60vh"><table><thead><tr><th>' + (by === 'cargo' ? 'Cargo' : 'Jornada') + '</th>' + cols + '<th>Venta / HH trabajada</th></tr></thead><tbody>' +
    rows.map(([id, a]) => '<tr class="click' + (sel.includes(id) ? ' sel' : '') + '" data-act="grow" data-v="' + esc(id) + '"><td>' + esc(by === 'cargo' ? id : jLabel(id)) + '</td>' + cells(a) +
      '<td style="min-width:110px"><div style="height:10px;background:var(--surface-2);border-radius:2px"><div style="height:100%;width:' + ((dv(V, a.hMes) || 0) / maxV * 100).toFixed(1) + '%;background:var(--s1);border-radius:2px"></div></div></td></tr>').join('') +
    '<tr class="tot"><td>Total</td>' + cells(T) + '<td></td></tr></tbody></table></div></section>';
}

// ---------- comparador de tiendas (resumen) ----------

// ---------- vista: proyección ----------
function projRows(key, ccs) {

}
function jorList(m) { return [...new Set(Object.keys(m.j).filter((j) => j !== 'sd' && m.j[j].n).map((j) => +j.slice(1)))].sort((a, b) => b - a); }
function vProy() {
  const key = S.month, P = S.cfg.params, to = +P.projTo || 40;
  const from = (P.projFrom || []).map(Number);
  const ccs = entityCCs(S.ent, key);
  const m = M(key, ccs), p = E.projection(m, S.cfg);

  h += '<section class="panel"><div class="ph"><div><h2>Supuestos</h2><p class="sub">Aplican a todos los meses. Guárdalos con el botón "Guardar cambios" que aparece abajo.</p></div></div><div class="grid3">' +

    '<div class="ctl"><label for="pTo">Jornada destino (h/semana)</label><input type="number" id="pTo" min="20" max="45" value="' + esc(to) + '"></div>' +
    '<div class="ctl"><label for="pVar">Gasto variable</label><select id="pVar"><option value="HORA"' + (P.projVarModo !== 'MONTO' ? ' selected' : '') + '>Se paga por hora: costo por hora igual</option><option value="MONTO"' + (P.projVarModo === 'MONTO' ? ' selected' : '') + '>Se mantiene el monto del mes</option></select></div>' +
    '</div></section>';
  const tile = (l, a, b, f, good, extra) => '<div class="kpi"><span class="l">' + esc(l) + '</span><span class="v">' + fmt(f, b) + '</span><span class="s">Hoy ' + fmt(f, a) + ' · ' + deltaHTML(b, a, good, f) + (extra ? '<br>' + extra : '') + '</span></div>';
  h += '<div class="kpis">' +
    '<div class="kpi"><span class="l">Personas afectadas</span><span class="v">' + F.int(p.n) + '</span><span class="s">' + F.int(nSin) + ' ya tienen ' + to + ' h o menos · total ' + F.int(m.hcFin) + '</span></div>' +
    tile('HH contratadas', m.hTeo, p.hTeoNew, 'int', 0, '−' + F.int(p.dTeo) + ' HH ≈ ' + F.dec1(p.fteRedTeo) + ' FTE de ' + to + ' h') +
    tile('HH trabajadas', m.hMes, p.hMesNew, 'int', 0, '−' + F.int(p.dPres) + ' HH ≈ ' + F.dec1(p.fteRed) + ' FTE') +
    tile('Venta / HH trabajada', m.k.ventaHHMes, p.ventaHHNew, 'clp', 1) +
    tile('Venta / HH contratada', m.k.ventaHHTeo, p.ventaHHTeoNew, 'clp', 1) +
    tile('Gasto / venta', m.k.costoVenta, p.costoVentaNew, 'pct', -1) + '</div>';
  // costo por hora
  const ch = [
    ['Fijo (base, gratificación, asignaciones)', m.cat.FIJO, p.fijoNew, m.k.fijoHH, p.fijoHHNew],
    ['Esporádicos (no cambian con la jornada)', m.cat.ESPOR, m.cat.ESPOR, m.k.esporHH, p.esporHHNew],
    ['Indemnizaciones (no cambian con la jornada)', m.cat.INDEM, m.cat.INDEM, m.k.indemHH, p.indemHHNew],
    ['Variable (' + (P.projVarModo === 'MONTO' ? 'monto se mantiene' : 'pagado por hora') + ')', m.cat.VARIABLE, p.varNew, m.k.varHH, p.varHHNew],
    ['Leyes sociales y contribución empleador', m.cat.LEYES + m.cat.CONTRIB, p.cargasNew, m.k.cargasHH, p.cargasHHNew],
  ];
  h += '<section class="panel"><div class="ph"><div><h2>Costo por hora trabajada</h2><p class="sub">' + esc(entName(S.ent)) + ' · ' + esc(curMonth().label) + '. El fijo se reparte en menos horas; el variable se paga por hora y su costo por hora no cambia.</p></div></div><div class="tbl-wrap"><table><thead><tr><th>Componente</th><th class="n">Monto hoy</th><th class="n">Monto proyectado</th><th class="n">$/HH hoy</th><th class="n">$/HH proyectado</th><th class="n">Variación $/HH</th></tr></thead><tbody>' +
    ch.map((r) => '<tr><td>' + esc(r[0]) + '</td><td class="n">' + F.mm(r[1]) + '</td><td class="n">' + F.mm(r[2]) + '</td><td class="n">' + F.clp(r[3]) + '</td><td class="n">' + F.clp(r[4]) + '</td><td class="n">' + deltaHTML(r[4], r[3], -1, 'clp') + '</td></tr>').join('') +

function puestosData(key, ccs) {
  const P = S.cfg.params, to = +P.projTo || 40, from = (P.projFrom || []).map(Number);
  const mo = S.months[key];
  const out = [];
  for (const c of ccs) {
    const d = mo.dot && mo.dot[c]; if (!d) continue;
    const cargos = {}; const st = { c, byJ: {}, af: 0, sin: 0, tot: 0 };
    for (const gk in d) {
      const gp = E.gParts(gk); if (gp.j === 'sd') continue; const j = +gp.j.slice(1); const g = d[gk];
      const cmap = g.cargos || (g.nFin ? { [gp.cargo]: g.nFin } : {});
      for (const cg in cmap) {
        if (S.filt.cargos.length && !S.filt.cargos.includes(cg)) continue;
        if (S.filt.jors.length && !S.filt.jors.includes(gp.j)) continue;
        const n = cmap[cg]; const x = (cargos[cg] = cargos[cg] || { cargo: cg, byJ: {}, af: 0, sin: 0, tot: 0 });
        x.byJ[j] = (x.byJ[j] || 0) + n; x.tot += n; st.byJ[j] = (st.byJ[j] || 0) + n; st.tot += n;
        if (j > to && from.includes(j)) { x.af += n; st.af += n; } else if (j <= to) { x.sin += n; st.sin += n; }
      }
    }
    if (!st.tot) continue;
    st.cargos = Object.values(cargos).sort((a, b) => b.af - a.af || b.tot - a.tot);
    out.push(st);
  }
  return out.sort((a, b) => b.af - a.af);
}

async function readFiles(list) {
  if (!window.XLSX) { S.load.msg = 'No se pudo cargar el lector de Excel. Revisa tu conexión y recarga la página.'; render(); return; }
  const msgs = [];
  for (const file of Array.from(list)) {
    try {
      const buf = await file.arrayBuffer();
      const wb = XLSX.read(buf, { type: 'array', cellDates: false, cellNF: false, cellText: false });
      const sheets = {};
      for (const n of wb.SheetNames) sheets[n] = XLSX.utils.sheet_to_json(wb.Sheets[n], { header: 1, raw: true, defval: null, blankrows: true });
      const det = E.detectWorkbook(sheets);
      if (!det) { msgs.push(file.name + ': no reconocí el formato.'); continue; }
      S.load.files[det.type] = { name: file.name, rows: sheets[det.sheet], header: det.header };
      const sug = E.suggestMonth(det.type, sheets[det.sheet], file.name);
      if (sug && !S.load.key) S.load.key = sug;
      msgs.push(file.name + ' → ' + E.TYPES[det.type]);
    } catch (err) { msgs.push(file.name + ': error al leer (' + (err && err.message || err) + ').'); }
  }
  S.load.result = null; S.load.msg = msgs.join(' · ');
  render();
}

// ---------- vista: guía ----------
function vGuia() {
  return '<section class="panel guide"><h2>Cómo cargar un mes</h2><p class="sub">Haz esto una vez al mes, después de cerrar remuneraciones.</p>' +
    '<ol class="steps"><li><b>Descarga los 6 archivos del mes vigente.</b><br>Ventas por tienda y Presencias con rango del <b>21 del mes anterior al 30/31 del mes vigente</b> (ej. 21/08/2026 al 30/09/2026). Activos del mes, Ausentismos del mes, Libro de remuneraciones y Centralización contable del mes.</li>' +
    '<li><b>Abre "Cargar mes" y arrastra los archivos.</b> No necesitas renombrarlos: cada uno se reconoce por sus columnas. Si un archivo no se reconoce, revisa que sea el reporte original sin columnas eliminadas.</li>' +
    '<li><b>Confirma el mes vigente.</b> Se sugiere desde el nombre del libro (202609) o la fecha del asiento. Revisa los días feriado: "auto" toma los días sin venta.</li>' +
    '<li><b>Procesa y revisa.</b> Verás totales y observaciones (personas que no están en activos, días del mes sin datos, asiento descuadrado).</li>' +
    '<li><b>Guarda.</b> Si el mes ya existía, se reemplaza. El historial se actualiza solo y los comparativos usan el mes anterior y el mismo mes del año anterior.</li>' +
    '<li><b>Revisa Configuración la primera vez y cuando aparezcan ítems nuevos.</b> Clasifica cada ítem (fijo, variable, esporádico, indemnización, leyes sociales empleador, contribución empleador, leyes sociales trabajador, descuento, no considerar) y el tratamiento de cada ausentismo.</li></ol>' +
    '<h3>Qué se toma de cada archivo</h3><div class="tbl-wrap"><table><thead><tr><th>Archivo</th><th>Uso</th></tr></thead><tbody>' +
    '<tr><td>Ventas por tienda</td><td style="white-space:normal">Venta del periodo de comisión (el que termina el 20 del mes) y venta del mes calendario (1 al último día), por tienda y sección.</td></tr>' +
    '<tr><td>Presencias</td><td style="white-space:normal">Minutos ÷ 60 = horas, en la tienda donde se trabajó (incluye préstamos). Mismos dos periodos que la venta.</td></tr>' +
    '<tr><td>Activos</td><td style="white-space:normal">Jornada semanal, CC, sueldo base y gratificación. Horas contratadas = jornada × días operativos del mes ÷ 7, proporcional a la fecha de alta o baja.</td></tr>' +
    '<tr><td>Ausentismos</td><td style="white-space:normal">Días de cada ausencia que caen dentro del mes (por fechas, no por el campo "días"). Horas = días × jornada ÷ 7.</td></tr>' +
    '<tr><td>Libro de remuneraciones</td><td style="white-space:normal">Haberes y descuentos por persona, asignados a su CC (columna cencos).</td></tr>' +
    '<tr><td>Centralización</td><td style="white-space:normal">Cuentas de gasto 6xxxxxx por concepto. Por defecto aporta las cargas del empleador (SIS, mutual, cesantía, SANNA, reforma previsional).</td></tr></tbody></table></div>' +
    '<h3>Indicadores</h3><ul><li><b>Venta / HH</b>: venta del mes ÷ horas de presencia del mes. La versión 21–20 usa el periodo de comisión.</li><li><b>Trabajadas / contratadas</b>: cuánto de la jornada contratada se trabajó.</li><li><b>Venta / HH contratada, disponible y trabajada</b>: la misma venta dividida por horas de jornada, por horas de jornada menos ausencias y por horas de presencia.</li><li><b>Ausentismo</b>: horas ausentes (pagadas + descontadas) ÷ horas contratadas.</li><li><b>Gasto / venta</b> y <b>Gasto / HH</b>: con el gasto total según las categorías marcadas.</li><li><b>Comisión / venta 21–20</b>: comisión del libro sobre la venta de su periodo.</li><li><b>FTE</b>: horas contratadas ÷ (jornada FTE × días operativos ÷ 7).</li><li><b>Proyección 40 h</b>: sin horas extra ni nueva dotación. Bajan las horas contratadas, trabajadas y de ausencia de las jornadas afectadas; el fijo se mantiene (sube su costo por hora) y el variable se paga por hora (su costo por hora no cambia).</li></ul>' +
    '<h3>Privacidad</h3><p>Los archivos se leen en tu navegador. Solo se guarda el resumen por centro de costo y jornada; no se guardan nombres, RUT ni sueldos individuales.</p></section>';
}

let cfgPending = false;
async function saveCfg() {

document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-view],[data-go],[data-act],[data-sort],[data-detail],[data-cfgtab],[data-psort],[data-pdet]');
  if (!t) return;
  if (t.dataset.view || t.dataset.go) { S.view = t.dataset.view || t.dataset.go; S.confirm = null; try { history.replaceState(null, '', '#' + S.view); } catch (_) {} render(); window.scrollTo(0, 0); return; }

  if (t.dataset.cfgtab) { S.cfgTab = t.dataset.cfgtab; render(); return; }

    case 'ausq': { const cs = ausCodesOf(S.month); S.ausSel = v === 'none' ? [] : cs.filter(([, a]) => (v === 'todo' ? a.trat !== 'EXCL' : a.trat === v)).map(([c]) => c); render(); break; }

    }
    case 'askgdel': S.confirm = 'gdel:' + v; render(); break;
    case 'gdel': S.confirm = null; setCfg((c) => { c.groups = c.groups.filter((g) => g.id !== v); }); if (S.ent === 'g:' + v) S.ent = 'ALL'; render(); break;
  }
});
document.addEventListener('change', (e) => {
  const t = e.target;
  if (t.id === 'selMonth') { S.month = t.value; S.detail = null; render(); return; }
  if (t.id === 'selEnt') { S.ent = t.value; render(); return; }
  if (t.id === 'cfEnt') { S.cmpForm.ent = t.value; S.cmpForm.person = ''; render(); return; }
  if (t.id === 'cfCargo') { S.cmpForm.cargo = t.value; S.cmpForm.person = ''; render(); return; }
  if (t.id === 'cfJor') { S.cmpForm.jor = t.value; S.cmpForm.person = ''; render(); return; }
  if (t.id === 'cfPer') { S.cmpForm.person = t.value; return; }
  if (t.id === 'fullWeeks') { S.fullWeeks = t.checked; render(); return; }
  if (t.id === 'soloVenta') { S.soloVenta = t.checked; render(); return; }
  if (t.dataset.icat) { const id = t.dataset.icat, v = t.value; setCfg((c) => { c.items[id] = v; }); return; }
  if (false && t.dataset.ihour) { const id = t.dataset.ihour; setCfg((c) => { const s = new Set(c.params.hourItems || []); t.checked ? s.add(id) : s.delete(id); c.params.hourItems = [...s]; }); return; }
  if (t.dataset.tcat) { const k = t.dataset.tcat; setCfg((c) => { const s = new Set(c.totalCats); t.checked ? s.add(k) : s.delete(k); c.totalCats = [...s]; }); return; }
  if (t.dataset.aus) { const code = t.dataset.aus, v = t.value; setCfg((c) => { c.aus[code] = v; }); return; }
  if (t.dataset.gcc) { editGroup.name = $('#gName').value; const s = new Set(editGroup.ccs); t.checked ? s.add(t.dataset.gcc) : s.delete(t.dataset.gcc); editGroup.ccs = [...s]; return; }
  if (t.dataset.pfrom) { const j = +t.dataset.pfrom; setCfg((c) => { const s = new Set((c.params.projFrom || []).map(Number)); t.checked ? s.add(j) : s.delete(j); c.params.projFrom = [...s].sort(); }); return; }
  if (t.hasAttribute('data-ccname')) { const c0 = t.dataset.ccname, v = t.value.trim(); setCfg((c) => { c.ccNames = c.ccNames || {}; if (v) c.ccNames[c0] = v; else delete c.ccNames[c0]; }); return; }
  if (t.dataset.fer) { const k = t.dataset.fer, v = Math.max(0, +t.value || 0); S.months[k].feriados = v; if (S.db) S.db.doc('months/' + k).update({ feriados: v }).catch((err) => toast(dbErr(err))); toast('Feriados actualizados'); render(); return; }
  const P = (fn) => setCfg((c) => fn(c.params));
  switch (t.id) {
    case 'comItem': P((p) => { p.commissionItem = t.value; }); break;
    case 'pTo': P((p) => { p.projTo = Math.max(20, Math.min(45, +t.value || 40)); }); break;
    case 'pVar': P((p) => { p.projVarModo = t.value; }); break;
    case 'pHe': P((p) => { p.heRecargo = Math.max(0, +t.value || 0); }); break;
    case 'pRepo': P((p) => { p.projRepo = +t.value; }); break;
    case 'pVt': P((p) => { p.ventaTipo = t.value; }); break;
    case 'pEx': P((p) => { p.excluirHoras = t.value === '1'; }); break;
    case 'pFte': P((p) => { p.fteBase = Math.max(10, +t.value || 42); }); break;
    case 'pJd': P((p) => { p.jorDefault = Math.max(10, +t.value || 42); }); break;
    case 'pFb': P((p) => { p.fallbackLibroAportes = t.value === '1'; }); break;
    case 'lKey': S.load.key = t.value; render(); break;
    case 'lFer': S.load.feriados = t.value === '' ? null : +t.value; break;
  }
});
document.addEventListener('input', (e) => {
  const t = e.target;
  if (t.id === 'pRepo') { const o = $('#pRepoV'); if (o) o.textContent = t.value + '%'; }
  if (t.id === 'pq') { S.pq = t.value; S.plimit = 200; clearTimeout(t._q); t._q = setTimeout(() => { render(); const i = $('#pq'); if (i) { i.focus(); i.setSelectionRange(i.value.length, i.value.length); } }, 250); }
  if (t.id === 'itemQ') { S.itemQ = t.value; clearTimeout(t._q); t._q = setTimeout(() => { render(); const i = $('#itemQ'); if (i) { i.focus(); i.setSelectionRange(i.value.length, i.value.length); } }, 250); }
});

// ---------- arranque y almacenamiento ----------
function mergeCfg(c) {
  c = c ? JSON.parse(JSON.stringify(c)) : c; // los snapshots llegan congelados: copiar antes de editar
  const d = E.defaultConfig();
  const out = Object.assign(d, c || {}); out.params = Object.assign(E.defaultConfig().params, (c && c.params) || {});
  out.items = out.items || {}; out.aus = out.aus || {}; out.groups = out.groups || []; out.ccNames = out.ccNames || {};
  if (!(c && c.v >= 2)) { if (Array.isArray(out.totalCats) && !out.totalCats.includes('ESPOR')) out.totalCats.push('ESPOR'); out.v = 2; }
  if (!(c && c.v >= 3)) { if (Array.isArray(out.totalCats) && !out.totalCats.includes('INDEM')) out.totalCats.push('INDEM'); out.v = 3; }
  return out;
}
function pickMonth() { const ks = monthKeys(); if (!S.month || !S.months[S.month]) S.month = ks.slice(-1)[0] || null; }
async function boot() {
  const h = (location.hash || '').slice(1); if (VIEWS.some((v) => v[0] === h)) S.view = h;
  render();
  const C = window.claude;
  if (!C || !C.use) { S.storeReady = true; render(); return; }
  const [db, user, dl] = await Promise.all([C.use('db').catch(() => null), C.use('user').catch(() => null), C.use('downloads').catch(() => null)]);
  S.db = db; S.user = user; S.dl = dl;
  if (user && user.can) { try { const w = await user.can('data.write'); if (w === false) S.canWrite = false; } catch (_) {} }
  if (!db) { S.storeReady = true; render(); return; }
  let got = { m: false, c: false, k: false };
  db.collection('daily').onSnapshot((snap) => { const o = {}; snap.docs.forEach((d) => { o[d.id] = clone(d.data()); }); S.daily = o; render(); }, () => {});
  const ready = () => { if (got.m && got.c && got.k && !S.storeReady) { S.storeReady = true; } pickMonth(); render(); };
  db.doc('config/main').onSnapshot((snap) => { if (!cfgPending && !S.cfgDirty && snap.exists) { S.cfg = mergeCfg(snap.data()); S.cfgSaved = clone(S.cfg); } got.k = true; ready(); }, () => { got.k = true; ready(); });
  db.collection('months').onSnapshot((snap) => { const o = {}; snap.docs.forEach((d) => { o[d.id] = clone(d.data()); }); S.months = o; got.m = true; ready(); }, () => { got.m = true; ready(); });
  db.collection('costs').onSnapshot((snap) => { const o = {}; snap.docs.forEach((d) => { o[d.id] = clone(d.data()); }); S.costs = o; got.c = true; ready(); }, () => { got.c = true; ready(); });
}
boot();
})();

</script>

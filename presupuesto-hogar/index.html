<script>
(() => {
"use strict";
const PDFJS = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js";

const clone = o => JSON.parse(JSON.stringify(o));
const sum = a => a.reduce((t, v) => t + (Number(v) || 0), 0);

const norm = s => String(s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9]+/g, " ").trim();
const fmt = n => { const v = Math.round(Number(n) || 0); return (v < 0 ? "−$" : "$") + Math.abs(v).toLocaleString("es-CL"); };
const fmtShort = v => { const a = Math.abs(v), s = v < 0 ? "−" : ""; if (a >= 1e6) return s + "$" + (a / 1e6).toLocaleString("es-CL", {maximumFractionDigits: 1}) + " M"; if (a >= 1e3) return s + "$" + Math.round(a / 1e3) + " mil"; return s + "$" + Math.round(a); };
const parseCLP = s => { const t = String(s ?? "").replace(/[^\d-]/g, ""); const n = parseInt(t, 10); return isNaN(n) ? 0 : n; };

/* ---------- estado ---------- */

/* ---------- cálculos ---------- */
const ingresosDe = m => sum(m.ingresos.map(i => i.monto));
const gastadoDe = x => sum((x.gastos || []).map(g => g.monto));
const plEfectivo = x => Math.max(Number(x.monto) || 0, gastadoDe(x));
function ahorroDe(I) { const a = CFG.ahorro; return Math.max(0, Math.round(a.modo === "porc" ? I * (Number(a.valor) || 0) / 100 : (Number(a.valor) || 0))); }
function ahorroBase(m) { return (m.ahorro && m.ahorro.aplicado && m.ahorro.montoFijado != null) ? m.ahorro.montoFijado : ahorroDe(ingresosDe(m)); }
function totales(m) {
  const I = ingresosDe(m), rec = sum(m.ingresos.filter(i => i.recibido).map(i => i.monto));
  const C = sum(m.cuentas.map(c => c.total));
  const pag = sum(m.cuentas.filter(c => c.estado === "pagado").map(c => c.total));
  const est = sum(m.cuentas.filter(c => c.estado !== "pagado" && c.estimado).map(c => c.total));
  const base = ahorroBase(m), extra = Number(m.ahorro?.extra) || 0, A = base + extra;

  const deAnterior = sum(m.cuentas.filter(c => !(c.tipo !== "tarjeta" && c.medioPago === "tarjeta") && c.fuente === "anterior").map(c => c.total));
  const cargo = C - aTarjeta - deAnterior;

}
const cuentaKey = c => (c.ref ? norm(c.emisor).split(" ")[0] + "|" + String(c.ref).replace(/\D/g, "").slice(-8) : norm(c.emisor) + "|" + norm(c.producto));
function latestCuentas() {
  const map = new Map();
  for (const k of keys()) for (const c of MONTHS[k].cuentas) {
    const real = c.tipo === "servicio" ? !c.estimado : (c.movimientos || []).length > 0;
    if (!real) continue;
    const key = cuentaKey(c), when = c.mesEstado || k, prev = map.get(key);
    if (!prev || when >= prev.when) map.set(key, { c, when });

}
function cronograma() {

    const N = Number(mv.cuotaTotal) || 1, n = Number(mv.cuotaActual) || 1, v = Number(mv.valorCuota) || 0;
    if (N > 1 && n < N && v > 0 && !mv.esPago) for (let k = 1; k <= N - n; k++) {
      const key = addMonths(when, k);
      (out[key] = out[key] || []).push({ desc: mv.descripcion, emisor: c.emisor, ref: c.ref, monto: v, n: n + k, N });
    }
  }
  return out;
}
function fijosDetectados() {
  const ex = new Set(CFG.fijosExcluidos || []), out = [];
  for (const { c } of latestCuentas()) {
    const k = cuentaKey(c);
    if (c.tipo === "servicio") {
      const id = k + "::total", div = c.frecuencia === "bimestral" ? 2 : 1;
      out.push({ id, nombre: c.emisor + (c.producto ? " · " + c.producto : ""), detalle: div === 2 ? "boleta bimestral ÷ 2" : "boleta mensual", monto: Math.round((Number(c.total) || 0) / div), excluido: ex.has(id) });
      continue;
    }
    for (const mv of c.movimientos || []) if (mv.recurrente && !mv.esPago) {
      const id = k + "::" + norm(mv.descripcion);
      out.push({ id, nombre: mv.descripcion, detalle: c.emisor + (c.ref ? " ···" + c.ref : ""), monto: Math.round(Number(mv.valorCuota) || Number(mv.monto) || 0), excluido: ex.has(id) });
    }

  for (const f of CFG.fijosManual || []) out.push({ id: "man::" + f.id, mid: f.id, manual: true, nombre: f.nombre, detalle: "agregado a mano", monto: Number(f.monto) || 0, excluido: false });

}

    for (const mv of c.movimientos || []) if (!mv.esPago && !mv.recurrente && (Number(mv.cuotaTotal) || 1) <= 1) t += Number(mv.monto) || 0; }

}
function proyeccion() {

/* ---------- meses ---------- */
function blankMonth(key) {
  return { mes: key, creado: today(), notas: "",
    ingresos: [
      { id: uid(), nombre: "Sueldo", monto: 0, recibido: false, recurrente: true },
      { id: uid(), nombre: "Aporte George", monto: 0, recibido: false, recurrente: false },
      { id: uid(), nombre: "Reintegro Manuel", monto: 0, recibido: false, recurrente: false }],
    planificados: [{ id: uid(), nombre: "Hobbies", monto: 0, recurrente: true, gastos: [] }],
    ahorro: { aplicado: false, montoFijado: null, extra: 0 }, cuentas: [] };
}
function estimadoTarjeta(c, key) {
  const fijo = sum((c.movimientos || []).filter(mv => mv.recurrente && !mv.esPago).map(mv => Number(mv.valorCuota) || Number(mv.monto) || 0));
  const base = c.mesEstado || key; let cu = 0;

}

    total: t, minimo: null, estado: "plantilla", estimado: true, medioPago: c.medioPago || null, tarjetaRef: c.tarjetaRef || null, fuente: "mes", vence: null, periodo: "", movimientos: [], cuotasFuturas: [],
    cupoTotal: c.cupoTotal ?? null, cupoUtilizado: null, mesEstado: null, archivo: null,
    notas: `Estimado a partir de ${mlabel(prevKey)}. Sube el documento real para reemplazarlo.` };

function createMonth(key) {
  if (MONTHS[key]) return MONTHS[key];
  const prevK = keys().filter(k => k < key).pop();
  const m = blankMonth(key);
  if (prevK) {
    const p = MONTHS[prevK];
    m.ingresos = p.ingresos.map(i => ({ id: uid(), nombre: i.nombre, monto: i.recurrente ? i.monto : 0, recibido: false, recurrente: i.recurrente }));
    if (p.planificados) m.planificados = p.planificados.map(x => ({ id: uid(), nombre: x.nombre, monto: x.recurrente ? x.monto : 0, recurrente: x.recurrente, gastos: [] }));
    const gap = monthsBetween(prevK, key);
    if (gap === 1) for (const c of p.cuentas) if (c.frecuencia !== "bimestral") m.cuentas.push(plantillaDe(c, key, prevK));
    for (const k2 of keys()) for (const c of MONTHS[k2].cuentas) {
      if (c.frecuencia === "bimestral" && !c.estimado && monthsBetween(k2, key) === 2 && !m.cuentas.some(x => cuentaKey(x) === cuentaKey(c))) m.cuentas.push(plantillaDe(c, key, k2));

  const rows = ks.map(k => { const m = MONTHS[k], T = totales(m); if (m.ahorro?.aplicado) acum += T.A; return { k, T, acum, ap: !!m.ahorro?.aplicado, n: m.cuentas.length }; });

function niceTicks(min, max, n) {
  const span = max - min || 1, raw = span / n, mag = Math.pow(10, Math.floor(Math.log10(raw))), f = raw / mag;

  for (let v = lo; v <= hi + step / 2; v += step) t.push(Math.round(v));
  return t;
}
function barPath(x, w, y0, y1, r) {

  return `M${x},${y0}V${y1 - r}Q${x},${y1} ${x + r},${y1}H${x + w - r}Q${x + w},${y1} ${x + w},${y1 - r}V${y0}Z`;
}
function bars(host, labels, series, tipRows) {

  const ticks = niceTicks(mn, mx, 4); mn = ticks[0]; mx = ticks[ticks.length - 1];
  const y = v => m.t + (mx - v) / (mx - mn) * (H - m.t - m.b);
  const bw = (W - m.l - m.r) / labels.length, gap = Math.max(6, bw * .28), inner = bw - gap;
  const sw = (inner - (series.length - 1) * 2) / series.length;
  let g = `<g class="grid">${ticks.map(t => `<line x1="${m.l}" x2="${W - m.r}" y1="${y(t)}" y2="${y(t)}"></line><text x="${m.l - 8}" y="${y(t) + 4}" text-anchor="end">${esc(fmtShort(t))}</text>`).join("")}</g>`;
  g += `<line class="zero" x1="${m.l}" x2="${W - m.r}" y1="${y(0)}" y2="${y(0)}"></line>`;
  const every = Math.ceil(labels.length / Math.max(1, Math.floor((W - m.l) / 52)));
  labels.forEach((L, i) => {
    series.forEach((s, si) => {
      const v = s.values[i], x = m.l + i * bw + gap / 2 + si * (sw + 2);
      const d = barPath(x, sw, y(0), y(v), 4);
      if (d) g += `<path d="${d}" fill="${s.colorFn ? s.colorFn(v) : s.color}"></path>`;
    });
    if (i % every === 0) g += `<text x="${m.l + i * bw + bw / 2}" y="${H - 8}" text-anchor="middle">${esc(L)}</text>`;
    g += `<rect class="hit" data-i="${i}" x="${m.l + i * bw}" y="${m.t}" width="${bw}" height="${H - m.t - m.b}"></rect>`;
  });
  host.innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Gráfico de barras">${g}</svg>`;
  const tip = $("#tip");
  host.querySelectorAll("rect.hit").forEach(r => {
    r.addEventListener("mousemove", e => { const i = +r.dataset.i; tip.innerHTML = tipRows(i); tip.hidden = false;
      const tw = tip.offsetWidth; tip.style.left = Math.min(window.innerWidth - tw - 8, e.clientX + 14) + "px"; tip.style.top = (e.clientY + 14) + "px"; });
    r.addEventListener("mouseleave", () => tip.hidden = true);
  });
}

function loadScript(src) { return new Promise((res, rej) => { const s = document.createElement("script"); s.src = src; s.onload = res; s.onerror = () => rej(new Error("load")); document.head.appendChild(s); }); }

async function leerPdf(file) {

    if (pw == null) { cancelada = true; task.destroy(); } else update(pw);
  };

  const images = [];
  if (text.replace(/\s|-|Página \d+/g, "").length < 300 && SAMPLE_IMG) {
    for (let p = 1; p <= Math.min(doc.numPages, MAX_IMG || 2, 4); p++) {

      await page.render({ canvasContext: cv.getContext("2d"), viewport: vp }).promise;

    }

}
const PROMPT = (texto, tieneImg) => `Lee este documento financiero chileno (estado de cuenta de tarjeta de crédito, boleta de luz, agua, gas, internet u otro cobro). ${tieneImg ? "Viene como imagen." : "Viene como texto extraído de un PDF; las columnas pueden venir desordenadas."}
Responde SOLO con un objeto JSON con esta forma:
{"tipo":"tarjeta|servicio|otro","emisor":"nombre corto de la empresa o banco, ej. Banco Falabella CMR, Itaú, SAESA","producto":"ej. Mastercard Elite, Visa, Electricidad, Agua potable","referencia":"string","fecha_emision":"AAAA-MM-DD","periodo_desde":"AAAA-MM-DD","periodo_hasta":"AAAA-MM-DD","fecha_vencimiento":"AAAA-MM-DD","total_a_pagar":0,"monto_minimo":null,"cupo_total":null,"cupo_utilizado":null,"frecuencia":"mensual|bimestral","pagado":false,"movimientos":[{"fecha":"AAAA-MM-DD","descripcion":"","monto_total":0,"valor_cuota_mes":0,"cuota_actual":1,"cuotas_totales":1,"categoria":"","recurrente":false,"es_pago":false}],"cuotas_futuras":[{"mes":"AAAA-MM","monto":0}],"notas":""}

- Movimientos: "valor_cuota_mes" es lo que se cobra este mes; "cuota_actual"/"cuotas_totales" vienen de la columna N° cuota (17/24 → 17 y 24; al contado → 1 y 1). "es_pago": true para pagos o abonos a la cuenta. "recurrente": true para suscripciones, PAT, seguros, mantención, comisiones u otros cargos que se repiten cada mes. En boletas de servicio, lista los ítems del cobro como movimientos.

- "cuotas_futuras": la tabla de vencimientos de los próximos meses si aparece.

${texto ? "\nTEXTO DEL DOCUMENTO:\n" + texto : ""}`;

async function procesar(files, replaceId) {

      if (!SAMPLE) throw { code: "no_sample" };
      let text = "", images = [];
      if (/pdf$/i.test(file.type) || /\.pdf$/i.test(file.name)) {
        u.msg = "Extrayendo texto…"; render();
        try { ({ text, images } = await leerPdf(file)); }
        catch (e) { throw { code: e && e.code === "pw_cancel" ? "pw_cancel" : "pdf" }; }
        if (!text.replace(/\s|-|Página \d+/g, "").length && !images.length) throw { code: SAMPLE_IMG ? "pdf" : "images_unavailable" };
      } else if (/^image\//.test(file.type)) {
        if (!SAMPLE_IMG) throw { code: "images_unavailable" };
        images = [file];
      } else throw { code: "tipo" };
      u.msg = "Claude está leyendo el documento…"; render();
      const opts = { modelTier: "default" }; if (images.length) opts.images = images;
      const data = await SAMPLE.json(PROMPT(images.length ? "" : text, images.length > 0), opts);
      if (!data || typeof data !== "object") throw { code: "invalid_json" };
      const c = aCuenta(data, file.name);
      u.st = "ok"; u.msg = `Leído: ${c.emisor} ${fmt(c.total)}`; render();
      abrirEditor(c, { origen: "leido", replaceId });
    } catch (e) {
      u.st = "err";
      u.msg = ({ no_sample: "Lectura automática no disponible: agrégalo a mano.", not_granted: "No se autorizó la lectura con Claude.", images_unavailable: "Esta vista no puede enviar imágenes. Agrégalo a mano.", image_rejected: "La imagen no se pudo leer. Prueba con otra foto.", rate_limited: "Demasiadas lecturas seguidas. Intenta en un rato.", invalid_json: "No pude interpretar el documento. Intenta de nuevo.", refused: "No se pudo leer este documento.", pdf: "No pude abrir el PDF.", pw_cancel: "PDF con clave: no se ingresó la clave.", tipo: "Usa un PDF o una foto (JPG, PNG)." })[e && e.code] || "Error al leer. Intenta de nuevo.";
      render();
    }

  setTimeout(() => $("#ed-emisor")?.focus(), 30);
}
function leerEditor() {
  const c = EDIT.c, v = id => $("#" + id).value;
  c.emisor = v("ed-emisor").trim() || "Cuenta"; c.producto = v("ed-producto").trim(); c.ref = v("ed-ref").trim(); c.tipo = v("ed-tipo");
  c.total = parseCLP(v("ed-total")); c.minimo = v("ed-minimo").trim() ? parseCLP(v("ed-minimo")) : null;
  c.vence = v("ed-vence") || null; c.periodo = v("ed-periodo").trim(); c.frecuencia = v("ed-frec"); c.estado = v("ed-estado");
  c.estimado = c.estado === "plantilla"; c.fechaPago = c.estado === "pagado" ? (v("ed-fpago") || today()) : null; c.notas = v("ed-notas").trim();
  c.fuente = v("ed-fuente"); const md = $("#ed-medio"); c.medioPago = md ? (md.value || null) : null; if (c.medioPago !== "tarjeta") c.tarjetaRef = null;
}
function guardarEditor() {
  leerEditor();
  const { c, ctx } = EDIT;
  if (ctx.origen === "edit") {
    const m = M(), i = m.cuentas.findIndex(x => x.id === c.id); if (i >= 0) m.cuentas[i] = c; dirty("month", CUR);
  } else {
    const m = createMonth(EDIT.target);
    const rep = document.querySelector('input[name="ed-rep"]:checked');
    const i = rep && rep.value === "rep" && EDIT.replace ? m.cuentas.findIndex(x => x.id === EDIT.replace) : -1;
    if (i >= 0) m.cuentas[i] = c; else m.cuentas.push(c);
    CUR = EDIT.target; dirty("month", EDIT.target);
    toast(i >= 0 ? `${c.emisor} actualizado en ${mlabel(EDIT.target)}` : `${c.emisor} agregado a ${mlabel(EDIT.target)}`);
  }
  cerrarModal(); render();
}
function cerrarModal() { $("#modal").hidden = true; $("#modal").innerHTML = ""; EDIT = null; }
function confirmar(titulo, texto, okTxt, fn) {
  $("#modal").innerHTML = `<div class="sheet" role="alertdialog" aria-labelledby="cf-h"><h2 id="cf-h">${esc(titulo)}</h2><p class="hint">${esc(texto)}</p><div class="acts"><button class="btn" data-act="ed-cancel">Cancelar</button><button class="btn primary" id="cf-ok">${esc(okTxt)}</button></div></div>`;
  $("#modal").hidden = false; $("#cf-ok").onclick = () => { cerrarModal(); fn(); }; $("#cf-ok").focus();
}

/* ---------- eventos ---------- */
document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const act = b.dataset.act, li = b.closest(".cuenta"), m = M();
  const c = li && m ? m.cuentas.find(x => x.id === li.dataset.id) : null;
  const ir = b.closest("[data-ing]"), ing = ir && m ? m.ingresos.find(x => x.id === ir.dataset.ing) : null;
  const pr = b.closest("[data-pla]"), pla = pr && m ? (m.planificados || []).find(x => x.id === pr.dataset.pla) : null;
  switch (act) {
    case "toggle-pago":
      if (c.estado === "pagado") { c.estado = c.estimado ? "plantilla" : "pendiente"; c.fechaPago = null; }
      else { c.estado = "pagado"; c.fechaPago = today(); }
      dirty("month", CUR); render(); break;
    case "expand": OPEN.has(c.id) ? OPEN.delete(c.id) : OPEN.add(c.id); render(); break;
    case "edit": abrirEditor(c, { origen: "edit" }); break;
    case "replace": pickFile(c.id); break;
    case "del-cuenta": confirmar("Quitar cuenta", `Se quitará ${c.emisor} de ${mlabel(CUR, true)}.`, "Quitar", () => { m.cuentas = m.cuentas.filter(x => x.id !== c.id); dirty("month", CUR); render(); }); break;
    case "add-cuenta": abrirEditor({ id: uid(), tipo: "otro", emisor: "", producto: "", ref: "", total: 0, minimo: null, vence: null, periodo: "", frecuencia: "mensual", estado: "pendiente", estimado: false, movimientos: [], cuotasFuturas: [], notas: "" }, { origen: "manual" }); break;
    case "add-ing": m.ingresos.push({ id: uid(), nombre: "Nuevo ingreso", monto: 0, recibido: false, recurrente: false }); dirty("month", CUR); render(); break;
    case "del-ing": m.ingresos = m.ingresos.filter(x => x !== ing); dirty("month", CUR); render(); break;
    case "ing-rec": ing.recibido = !ing.recibido; dirty("month", CUR); render(); break;
    case "add-pla": (m.planificados = m.planificados || []).push({ id: uid(), nombre: "Nuevo ítem", monto: 0, recurrente: true, gastos: [] }); dirty("month", CUR); render(); break;
    case "del-pla": m.planificados = m.planificados.filter(x => x !== pla); dirty("month", CUR); render(); break;
    case "pla-open": { const k = "pla:" + pla.id; OPEN.has(k) ? OPEN.delete(k) : OPEN.add(k); render(); break; }
    case "del-gasto": { const gid = b.closest("tr").dataset.g; pla.gastos = (pla.gastos || []).filter(g => g.id !== gid); dirty("month", CUR); render(); break; }
    case "pla-fijo": pla.recurrente = !pla.recurrente; dirty("month", CUR); render(); break;
    case "ing-fijo": ing.recurrente = !ing.recurrente; dirty("month", CUR); render(); break;
    case "aho-aplicado":
      m.ahorro.aplicado = !m.ahorro.aplicado; m.ahorro.montoFijado = m.ahorro.aplicado ? ahorroDe(ingresosDe(m)) : null; dirty("month", CUR); render(); break;
    case "aho-completar": { const T = totales(m); if (T.saldo > 0) { m.ahorro.extra = (Number(m.ahorro.extra) || 0) + T.saldo; dirty("month", CUR); toast(`${fmt(T.saldo)} sumados al ahorro`); render(); } break; }
    case "del-month": confirmar("Eliminar mes", `Se borrará ${mlabel(CUR, true)} con sus ingresos y cuentas. No se puede deshacer.`, "Eliminar", () => { const k = CUR; delete MONTHS[k]; dirty("month", k); const ks = keys(); CUR = ks.filter(x => x < k).pop() || ks[0] || null; render(); }); break;
    case "create-current": { const k = today().slice(0, 7); createMonth(k); CUR = k; render(); break; }
    case "pick-file": pickFile(null); break;
    case "goto": CUR = b.dataset.k; location.hash = "#mes"; break;
    case "ed-cancel": cerrarModal(); break;
    case "fijo-toggle": { const id = b.closest("tr").dataset.fijo; const ex = new Set(CFG.fijosExcluidos); b.checked ? ex.delete(id) : ex.add(id); CFG.fijosExcluidos = [...ex]; dirty("cfg"); render(); break; }
    case "fijo-del": { const id = b.closest("tr").dataset.fijo.replace("man::", ""); CFG.fijosManual = CFG.fijosManual.filter(f => f.id !== id); dirty("cfg"); render(); break; }
  }
});
let replaceTarget = null;
function pickFile(rid) { replaceTarget = rid; const f = $("#fileIn"); f.value = ""; f.click(); }
$("#fileIn").addEventListener("change", e => { const fs = [...e.target.files]; const r = replaceTarget; replaceTarget = null; if (fs.length) procesar(fs, r); });
document.addEventListener("dragover", e => { const d = e.target.closest && e.target.closest("#drop"); if (d) { e.preventDefault(); d.classList.add("over"); } });
document.addEventListener("dragleave", e => { const d = e.target.closest && e.target.closest("#drop"); if (d) d.classList.remove("over"); });
document.addEventListener("drop", e => { const d = e.target.closest && e.target.closest("#drop"); if (d) { e.preventDefault(); d.classList.remove("over"); const fs = [...e.dataTransfer.files]; if (fs.length) procesar(fs, null); } });

document.addEventListener("change", e => {
  const t = e.target, m = M();
  if (t.closest("[data-ing]") && t.dataset.f) {
    const ing = m.ingresos.find(x => x.id === t.closest("[data-ing]").dataset.ing);
    if (t.dataset.f === "monto") ing.monto = parseCLP(t.value); else ing.nombre = t.value.trim() || "Ingreso";
    dirty("month", CUR); render(); return;
  }
  if (t.dataset.pay) {
    const c = m.cuentas.find(x => x.id === t.closest(".cuenta").dataset.id);
    if (t.dataset.pay === "fuente") c.fuente = t.value;
    if (t.dataset.pay === "medio") { c.medioPago = t.value || null; if (t.value !== "tarjeta") c.tarjetaRef = null; }
    if (t.dataset.pay === "tarjeta") c.tarjetaRef = t.value || null;
    dirty("month", CUR); render(); return;
  }
  if (t.closest("[data-pla]") && t.dataset.f) {
    const x = m.planificados.find(y => y.id === t.closest("[data-pla]").dataset.pla);
    if (t.dataset.f === "monto") x.monto = parseCLP(t.value); else x.nombre = t.value.trim() || "Ítem";
    dirty("month", CUR); render(); return;
  }
  switch (t.id) {
    case "notas": m.notas = t.value; dirty("month", CUR); return;
    case "aho-modo": CFG.ahorro.modo = t.value; CFG.ahorro.valor = t.value === "porc" ? 10 : 0; dirty("cfg"); break;
    case "aho-valor": CFG.ahorro.valor = CFG.ahorro.modo === "porc" ? Math.min(100, Math.max(0, parseFloat(String(t.value).replace(",", ".").replace(/[^\d.]/g, "")) || 0)) : parseCLP(t.value); dirty("cfg"); break;
    case "aho-meta": CFG.ahorro.meta = parseCLP(t.value); dirty("cfg"); break;
    case "aho-extra": m.ahorro.extra = parseCLP(t.value); dirty("month", CUR); break;
    case "p-var": CFG.proyeccion.gastoVariable = parseCLP(t.value); dirty("cfg"); break;
    case "p-carga": CFG.proyeccion.cargaMaxPct = Math.min(100, Math.max(0, Number(t.value) || 0)); dirty("cfg"); break;
    case "p-colchon": CFG.proyeccion.colchonPct = Math.min(50, Math.max(0, Number(t.value) || 0)); dirty("cfg"); break;
    case "s-monto": CFG.sim.monto = parseCLP(t.value); dirty("cfg"); break;
    case "s-cuotas": CFG.sim.cuotas = Math.min(72, Math.max(1, parseInt(t.value, 10) || 1)); dirty("cfg"); break;
    case "s-tasa": CFG.sim.tasa = Math.max(0, parseFloat(String(t.value).replace(",", ".")) || 0); dirty("cfg"); break;
    case "ed-mes": leerEditor(); EDIT.target = t.value; autoMatch(); pintarEditor(); return;
    case "ed-tipo": leerEditor(); pintarEditor(); return;
    default: return;
  }
  render();
});
document.addEventListener("submit", e => {
  e.preventDefault();
  if (e.target.id === "ed-form") guardarEditor();
  if (e.target.classList.contains("pla-add")) {
    const id = e.target.dataset.pla, x = (M().planificados || []).find(y => y.id === id); if (!x) return;
    const d = $("#pg-d-" + id).value.trim(), v = parseCLP($("#pg-m-" + id).value), f = $("#pg-f-" + id).value || today();
    if (!d || !v) { toast("Escribe una descripción y un monto"); return; }
    (x.gastos = x.gastos || []).push({ id: uid(), fecha: f, descripcion: d.slice(0, 80), monto: v }); dirty("month", CUR); render();
    setTimeout(() => $("#pg-d-" + id)?.focus(), 0);
  }
  if (e.target.id === "fijo-add") { const n = $("#fa-n").value.trim(), v = parseCLP($("#fa-m").value); if (n && v) { CFG.fijosManual.push({ id: uid(), nombre: n, monto: v }); dirty("cfg"); render(); } }
});
document.addEventListener("keydown", e => { if (e.key !== "Escape") return; if (pwResolve) pwResolve(null); else if (!$("#modal").hidden) cerrarModal(); });
$("#modal").addEventListener("click", e => { if (e.target.id === "modal") cerrarModal(); });
document.addEventListener("click", e => {
  if (e.target.id === "editTitle") {
    const t = (CFG && CFG.titulo) || "Presupuesto";
    $("#brand").innerHTML = `<form id="titleForm"><input type="text" id="titleIn" maxlength="60" value="${esc(t)}" aria-label="Nombre del presupuesto"><button class="btn small primary">Guardar</button><button type="button" class="btn small" id="titleCancel">Cancelar</button></form>`;
    $("#titleIn").focus(); $("#titleIn").select();
  } else if (e.target.id === "titleCancel") restoreBrand();
});
function restoreBrand() { $("#brand").innerHTML = `<h1 id="appTitle"></h1><button class="btn link small" id="editTitle" aria-label="Editar nombre del presupuesto">Editar nombre</button>`; renderTitle(); }
document.addEventListener("submit", e => {
  if (e.target.id !== "titleForm") return;
  e.preventDefault(); CFG.titulo = $("#titleIn").value.trim() || "Presupuesto"; dirty("cfg"); restoreBrand(); toast("Nombre guardado");
});
$("#monthSel").addEventListener("change", e => { CUR = e.target.value; render(); });
$("#prevM").addEventListener("click", () => { const ks = keys(), i = ks.indexOf(CUR); if (i > 0) { CUR = ks[i - 1]; render(); } });
$("#nextM").addEventListener("click", () => { const ks = keys(), i = ks.indexOf(CUR); if (i < ks.length - 1) { CUR = ks[i + 1]; render(); } });
$("#newMonth").addEventListener("click", () => {
  const ks = keys(), k = ks.length ? addMonths(ks[ks.length - 1], 1) : today().slice(0, 7);
  createMonth(k); CUR = k; if (VIEW !== "mes") location.hash = "#mes"; else render();
  toast(`${mlabel(k, true)} creado con tus ingresos fijos y cuentas estimadas`);
});
function route() { const h = location.hash.replace("#", ""); VIEW = ["mes", "proyeccion", "historial"].includes(h) ? h : "mes"; render(); }
window.addEventListener("hashchange", route);
let rz; window.addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(drawCharts, 150); });

initStore().then(route);
})();
</script>
